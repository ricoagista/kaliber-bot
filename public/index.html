<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaliber Bot - Panel Admin</title>
  <link rel="icon" type="image/avif" href="/kaliber.avif">
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem('kaliber_theme');
      } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Token mengikuti DESIGN.md (gaya terinspirasi Vercel / Geist, bukan aset resmi) */
    /* Skala z-index: header = 10, modal = 100, toast = 110 */
    :root {
      --bg-page: #fafafa;
      --bg-surface: #ffffff;
      --bg-elevated: #ffffff;
      --bg-subtle: #f5f5f5;
      --text-primary: #171717;
      --text-secondary: #4d4d4d;
      --text-mute: #666666;
      --border-hairline: #ebebeb;
      --border-control: #888888;
      --color-primary: #171717;
      --color-primary-pressed: #333333;
      --on-primary: #ffffff;
      --focus-ring: #0070f3;
      --color-link: #0070f3;
      --color-link-deep: #0761d1;
      --selection-bg: #171717;
      --selection-fg: #f2f2f2;

      --badge-success-bg: #d3e5ff;
      --badge-success-text: #0761d1;
      --badge-warn-bg: #ffefcf;
      --badge-warn-text: #ab570a;
      --badge-error-bg: #f7d4d6;
      --badge-error-text: #c50000;
      --badge-neutral-bg: #f5f5f5;
      --badge-neutral-text: #4d4d4d;

      --shadow-card: 0px 1px 1px rgba(0, 0, 0, 0.02), 0px 2px 2px rgba(0, 0, 0, 0.04), 0px 8px 8px -8px rgba(0, 0, 0, 0.04);
      --shadow-toast: 0px 2px 2px rgba(0, 0, 0, 0.04), 0px 8px 16px -4px rgba(0, 0, 0, 0.06);
      --shadow-modal: 0px 1px 1px rgba(0, 0, 0, 0.02), 0px 8px 16px -4px rgba(0, 0, 0, 0.06), 0px 24px 32px -8px rgba(0, 0, 0, 0.08);
      --backdrop-modal: rgba(23, 23, 23, 0.45);

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;

      --space-xxs: 4px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 40px;
      --space-3xl: 48px;
      --space-4xl: 64px;

      --font-sans: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg-page: #0a0a0a;
      --bg-surface: #111111;
      --bg-elevated: #171717;
      --bg-subtle: #1a1a1a;
      --text-primary: #ededed;
      --text-secondary: #a1a1a1;
      --text-mute: #888888;
      --border-hairline: #262626;
      --border-control: #666666;
      --color-primary: #ededed;
      --color-primary-pressed: #d4d4d4;
      --on-primary: #171717;
      --focus-ring: #3291ff;
      --color-link: #3291ff;
      --color-link-deep: #68b5ff;
      --selection-bg: #ededed;
      --selection-fg: #171717;

      --badge-success-bg: #0f2942;
      --badge-success-text: #68b5ff;
      --badge-warn-bg: #2e1d09;
      --badge-warn-text: #f5a623;
      --badge-error-bg: #361216;
      --badge-error-text: #ff6166;
      --badge-neutral-bg: #1f1f1f;
      --badge-neutral-text: #a1a1a1;

      --shadow-card: 0px 1px 1px rgba(0, 0, 0, 0.3), 0px 2px 2px rgba(0, 0, 0, 0.4);
      --shadow-toast: 0px 2px 4px rgba(0, 0, 0, 0.5), 0px 8px 16px -4px rgba(0, 0, 0, 0.6);
      --shadow-modal: 0px 1px 2px rgba(0, 0, 0, 0.4), 0px 8px 16px -4px rgba(0, 0, 0, 0.6), 0px 24px 32px -8px rgba(0, 0, 0, 0.75);
      --backdrop-modal: rgba(0, 0, 0, 0.72);
    }

    ::selection {
      background-color: var(--selection-bg);
      color: var(--selection-fg);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "ss02";
      font-size: 16px;
      line-height: 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-feature-settings: inherit;
      color: inherit;
    }

    a {
      color: var(--color-link);
      text-decoration: underline;
    }
    a:hover {
      color: var(--color-link-deep);
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .hidden {
      display: none !important;
    }

    /* Pembungkus Logo Kaliber (4320x4320 transparan, dipotong perisai) */
    .logo-crop-header {
      position: relative;
      width: 24px;
      height: 32px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-crop-header img {
      position: absolute;
      width: 38px;
      height: 38px;
      left: -7px;
      top: -3px;
      max-width: none;
      display: block;
    }

    .logo-crop-login {
      position: relative;
      width: 53px;
      height: 72px;
      overflow: hidden;
      margin: 0 auto var(--space-md) auto;
    }
    .logo-crop-login img {
      position: absolute;
      width: 85px;
      height: 85px;
      left: -16px;
      top: -7px;
      max-width: none;
      display: block;
    }

    /* Layar Login (ex-auth-form-card) */
    .login-shell {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-card);
    }

    @media (max-width: 480px) {
      .login-shell {
        padding: 12px;
      }
      .login-card {
        padding: 24px 16px;
        border-radius: var(--radius-md);
      }
      .login-title {
        font-size: 20px;
        line-height: 28px;
      }
    }

    .login-title {
      margin: 0 0 var(--space-xs) 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: -0.96px;
      text-align: center;
    }

    .login-subtitle {
      margin: 0 0 var(--space-lg) 0;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Header & Navigasi (nav-bar) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 64px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
    }

    .header-inner {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: var(--space-sm) var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      min-width: 0;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .tabs-bar {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
    }

    .tabs-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-lg);
      display: flex;
      gap: var(--space-xxs);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-inner::-webkit-scrollbar {
      display: none;
    }

    .segmented-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: -0.28px;
      padding: var(--space-sm) var(--space-md);
      cursor: pointer;
      white-space: nowrap;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      flex: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .segmented-tab:hover {
      color: var(--text-primary);
    }

    .segmented-tab[aria-selected="true"] {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 500;
    }

    /* Kontainer Utama */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-lg);
    }

    @media (max-width: 767px) {
      .header-inner,
      .tabs-inner,
      .main-container {
        padding-left: 12px;
        padding-right: 12px;
      }
      .main-container {
        padding-top: 12px;
        padding-bottom: 24px;
      }
      .card-base {
        padding: 16px 12px;
        margin-bottom: 14px;
        border-radius: var(--radius-sm);
      }
      .card-header {
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-sm);
      }
      .card-header .btn-row {
        width: 100%;
        justify-content: flex-start;
      }
      .card-title {
        font-size: 17px;
        line-height: 24px;
      }
      .card-desc {
        font-size: 13px;
        line-height: 18px;
      }
      .brand-name {
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .app-header {
        height: auto;
        min-height: 52px;
        padding: var(--space-xs) 0;
      }
      .header-inner {
        padding-top: 0;
        padding-bottom: 0;
        flex-wrap: nowrap;
        gap: 0.5rem;
      }
      .brand-group {
        gap: var(--space-xs);
        min-width: 0;
      }
      .brand-name {
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-actions {
        gap: 6px;
        flex: none;
      }
      .header-actions .btn-sm:not(.btn-icon) {
        padding: 0 8px;
        min-height: 28px;
        font-size: 12px;
      }
      .switch-row {
        font-size: 13px;
        padding: 10px 0;
      }
    }

    /* Kartu & Seksi (card-marketing) */
    .card-base {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
      box-shadow: var(--shadow-card);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .card-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.6px;
    }

    .card-desc {
      margin: var(--space-xxs) 0 0 0;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
      color: var(--text-secondary);
    }

    /* Tombol (Geist in-app scale: radius 6px, weight 500) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 var(--space-md);
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: -0.28px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: var(--on-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-primary-pressed);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-control);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-subtle);
    }

    .btn-danger {
      background-color: var(--badge-error-bg);
      color: var(--badge-error-text);
      border-color: var(--border-control);
    }

    .btn-sm {
      min-height: 32px;
      padding: 0 var(--space-sm);
      font-size: 13px;
      line-height: 18px;
    }

    .btn-icon {
      width: 32px;
      padding: 0;
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Form & Input (form-input: 40px height, 6px radius, 14px body-sm) */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .field-label {
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: -0.28px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-xs);
    }

    .field-hint {
      font-size: 13px;
      line-height: 18px;
      color: var(--text-secondary);
      margin: 0;
    }

    .field-error {
      font-size: 13px;
      line-height: 18px;
      color: var(--badge-error-text);
      background-color: var(--badge-error-bg);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      margin-top: var(--space-xxs);
    }

    .field-warn {
      font-size: 13px;
      line-height: 18px;
      color: var(--badge-warn-text);
      background-color: var(--badge-warn-bg);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      margin-top: var(--space-xxs);
    }

    .field-success {
      font-size: 13px;
      line-height: 18px;
      color: var(--badge-success-text);
      background-color: var(--badge-success-bg);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      margin-top: var(--space-xxs);
    }

    .text-input,
    .select-input {
      width: 100%;
      height: 40px;
      padding: 0 var(--space-sm);
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-sm);
    }

    .text-input:read-only,
    .text-input:disabled,
    .select-input:disabled,
    .textarea-input:disabled {
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .textarea-input {
      width: 100%;
      min-height: 120px;
      padding: var(--space-sm);
      font-size: 14px;
      line-height: 20px;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-sm);
      resize: vertical;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      letter-spacing: 0;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md);
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-md);
    }

    @media (max-width: 767px) {
      .form-grid-2,
      .form-grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }

    @media (max-width: 767px) {
      .form-footer {
        flex-direction: column-reverse;
        gap: var(--space-sm);
      }
      .form-footer .btn {
        width: 100%;
        min-height: 42px;
      }
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }

    /* Saklar Checkbox Baris */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding: var(--space-sm) 0;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .switch-row:last-child {
      border-bottom: none;
    }
    .switch-input {
      width: 18px;
      height: 18px;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    /* Daftar Prioritas Model (Tab Model) */
    .model-priority-card {
      margin-bottom: var(--space-md);
    }
    .model-priority-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-xs);
    }
    .model-priority-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: var(--space-xs) 0 var(--space-sm) 0;
      max-height: 480px;
      overflow-y: auto;
    }
    .model-priority-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      padding: 10px 14px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .model-priority-item:hover {
      background-color: var(--bg-subtle);
    }
    .model-priority-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .model-priority-grip {
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      opacity: 0.5;
    }
    .model-priority-num {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      min-width: 22px;
      flex: none;
    }
    .model-priority-name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-priority-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }
    .btn-icon-sm {
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .btn-icon-sm:hover:not(:disabled) {
      background-color: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-control);
    }
    .btn-icon-sm.danger:hover:not(:disabled) {
      background-color: var(--badge-error-bg);
      color: var(--badge-error-text);
      border-color: var(--badge-error-text);
    }
    .btn-icon-sm:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .btn-icon-sm svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .model-add-dashed {
      border: 1px dashed var(--border-control);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: transparent;
      cursor: pointer;
      width: 100%;
      transition: all 120ms ease;
    }
    .model-add-dashed:hover:not(:disabled) {
      border-color: var(--color-primary);
      color: var(--text-primary);
      background-color: var(--bg-subtle);
    }
    .model-add-dashed svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    .model-add-box {
      border: 1px dashed var(--border-control);
      border-radius: var(--radius-sm);
      padding: var(--space-sm);
      background-color: var(--bg-subtle);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    @media (max-width: 640px) {
      .model-priority-item {
        padding: 10px 10px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .model-priority-left {
        gap: 6px;
        min-width: 0;
        width: 100%;
      }
      .model-priority-name {
        font-size: 12px;
        flex: 1;
        min-width: 0;
      }
      .model-priority-num {
        min-width: 18px;
        font-size: 12px;
      }
      .model-priority-actions {
        width: 100%;
        justify-content: flex-end;
        padding-top: 6px;
        border-top: 1px dashed var(--border-subtle);
        margin-top: 2px;
      }
      .btn-icon-sm {
        width: 36px;
        height: 36px;
        min-height: 36px;
      }
      .model-add-box .btn-row {
        width: 100%;
      }
      .model-add-box .btn-row .btn {
        flex: 1;
        min-height: 36px;
      }
    }

    /* Daftar model per provider: tabel dengan pencarian dan pilihan satu klik */
    .models-panel {
      margin-top: var(--space-md);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
    }
    @media (max-width: 600px) {
      .models-panel-head {
        flex-direction: column;
        align-items: stretch;
      }
      .models-panel-head .text-input {
        max-width: none;
        width: 100%;
      }
      .models-table th,
      .models-table td {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
    .models-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      flex-wrap: wrap;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--border-hairline);
    }
    .models-panel-head .text-input {
      max-width: 280px;
      min-height: 32px;
      height: 32px;
    }
    .models-scroll {
      max-height: 320px;
      overflow-y: auto;
    }
    .models-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .models-table th,
    .models-table td {
      padding: 8px var(--space-md);
      text-align: left;
      border-bottom: 1px solid var(--border-hairline);
    }
    .models-table th {
      position: sticky;
      top: 0;
      background-color: var(--bg-subtle);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    .models-table tr:last-child td {
      border-bottom: none;
    }
    .models-table tr.is-selected td {
      background-color: var(--bg-subtle);
    }
    .models-table td.model-action {
      width: 1%;
      white-space: nowrap;
      text-align: right;
    }

    /* Saklar besar untuk status bot: posisi kenop dan warna jalur menandakan aktif atau mati */
    .bot-switch {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .bot-switch-label {
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      letter-spacing: -0.28px;
      min-width: 76px;
      text-align: right;
    }
    .switch-toggle {
      position: relative;
      flex: none;
      width: 48px;
      height: 28px;
      padding: 0;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-control);
      background-color: var(--bg-hover);
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease;
    }
    .switch-toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background-color: var(--text-secondary);
      transition: transform 160ms ease, background-color 160ms ease;
    }
    .switch-toggle[aria-checked="true"] {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
    }
    .switch-toggle[aria-checked="true"]::after {
      transform: translateX(20px);
      background-color: var(--on-primary);
    }
    .switch-toggle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Badge (badge-secondary: caption 12px/16px, rounded.full) */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px var(--space-xs);
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .badge-success {
      background-color: var(--badge-success-bg);
      color: var(--badge-success-text);
    }
    .badge-warn {
      background-color: var(--badge-warn-bg);
      color: var(--badge-warn-text);
    }
    .badge-error {
      background-color: var(--badge-error-bg);
      color: var(--badge-error-text);
    }
    .badge-neutral {
      background-color: var(--badge-neutral-bg);
      color: var(--badge-neutral-text);
    }

    /* Ringkasan Metrik Polos (caption-mono untuk label teknis) */
    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-lg);
      padding: var(--space-md) 0;
      border-top: 1px solid var(--border-hairline);
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: var(--space-lg);
    }

    @media (max-width: 900px) {
      .metrics-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .metrics-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 10px;
        padding: 12px 0;
      }
      .metric-value {
        font-size: 18px;
        line-height: 24px;
        letter-spacing: -0.5px;
      }
      .metric-label {
        font-size: 11px;
      }
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-xxs);
    }

    .metric-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .metric-value {
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: -0.96px;
      font-family: var(--font-sans);
      word-break: break-word;
    }

    .metric-value-sm {
      font-size: 13px;
      font-weight: 400;
      line-height: 20px;
      font-family: var(--font-mono);
      word-break: break-all;
    }

    /* QR & Pairing */
    .wa-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-lg);
      align-items: start;
    }

    @media (max-width: 767px) {
      .wa-grid {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
      .qr-box {
        margin: 0 auto;
        width: 220px;
        height: 220px;
      }
      .pairing-code-display {
        font-size: 16px;
        letter-spacing: 1.5px;
        padding: 6px 12px;
        width: 100%;
        max-width: 280px;
        justify-content: center;
        box-sizing: border-box;
      }
    }

    .qr-box {
      width: 256px;
      height: 256px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xs);
      background-color: var(--bg-subtle);
      text-align: center;
      font-size: 13px;
      line-height: 20px;
      color: var(--text-secondary);
    }

    .qr-box img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .pairing-code-display {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-md);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-control);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: var(--space-sm);
    }

    /* Daftar Provider & Key (dipisahkan garis hairline) */
    .provider-list {
      border-top: 1px solid var(--border-hairline);
    }

    .provider-block {
      padding: var(--space-lg) 0;
      border-bottom: 1px solid var(--border-hairline);
    }

    .provider-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }

    .provider-title-group {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .key-list {
      margin-top: var(--space-md);
      border-top: 1px solid var(--border-hairline);
    }

    .key-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }

    .key-info {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    @media (max-width: 767px) {
      .provider-block {
        padding: var(--space-md) 0;
      }
      .provider-top {
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-xs);
      }
      .provider-title-group {
        width: 100%;
      }
      .provider-top .btn-row {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .provider-top .btn-row .btn {
        flex: 1 1 calc(50% - 4px);
        min-height: 36px;
        font-size: 12px;
        padding: 0 8px;
        justify-content: center;
      }
      .key-row {
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-xs);
        padding: 10px 0;
      }
      .key-info {
        width: 100%;
      }
      .key-row .btn-row {
        width: 100%;
        display: flex;
        gap: 6px;
      }
      .key-row .btn-row .btn {
        flex: 1;
        min-height: 34px;
        font-size: 12px;
        padding: 0 8px;
        justify-content: center;
      }
    }

    /* Kotak Uji Coba Chat */
    .chat-transcript {
      min-height: 260px;
      max-height: 460px;
      overflow-y: auto;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      background-color: var(--bg-subtle);
    }

    @media (max-width: 767px) {
      .chat-transcript {
        min-height: 180px;
        max-height: 340px;
        padding: 10px;
        gap: 10px;
      }
      .chat-bubble {
        font-size: 13px;
        line-height: 19px;
      }
      .chat-meta {
        font-size: 11px;
        gap: 4px;
      }
    }

    .chat-item {
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--border-hairline);
    }
    .chat-item:last-child {
      border-bottom: none;
    }

    .chat-role {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .chat-bubble {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
    }

    .chat-meta {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
    }

    /* Tabel Log & Audit (ex-data-table-cell: header caption-mono uppercase, body body-sm) */
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.28px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .comparison-table th {
      text-align: left;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid var(--border-hairline);
      background-color: var(--bg-subtle);
    }

    .comparison-table td {
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid var(--border-hairline);
      vertical-align: top;
      word-break: break-word;
    }

    .comparison-table tr:last-child td {
      border-bottom: none;
    }

    @media (max-width: 767px) {
      .comparison-table,
      .comparison-table thead,
      .comparison-table tbody,
      .comparison-table th,
      .comparison-table td,
      .comparison-table tr {
        display: block;
      }
      .comparison-table {
        background-color: transparent;
        border: none;
      }
      .comparison-table thead {
        display: none;
      }
      .comparison-table tbody {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .comparison-table tr {
        padding: 12px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-sm);
        background-color: var(--bg-surface);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .comparison-table td {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 0;
        border: none;
        border-bottom: 1px dashed var(--border-subtle);
        font-size: 13px;
        line-height: 18px;
      }
      .comparison-table td:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .comparison-table td::before {
        content: attr(data-label);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        flex: none;
        min-width: 68px;
      }
    }

    /* Terminal Console Log Realtime */
    .console-terminal-card {
      margin-bottom: var(--space-md);
    }
    .console-terminal {
      background-color: #08090d;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      height: 320px;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .console-line {
      display: flex;
      gap: 8px;
      align-items: baseline;
      word-break: break-all;
    }
    .console-time {
      color: #64748b;
      flex: none;
      font-variant-numeric: tabular-nums;
    }
    .console-tag {
      flex: none;
      font-weight: 600;
      font-size: 11px;
      padding: 0 4px;
      border-radius: 2px;
    }
    .console-tag.info {
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.12);
    }
    .console-tag.success {
      color: #4ade80;
      background-color: rgba(74, 222, 128, 0.12);
    }
    .console-tag.warn {
      color: #fbbf24;
      background-color: rgba(251, 191, 36, 0.12);
    }
    .console-tag.error {
      color: #f87171;
      background-color: rgba(248, 113, 113, 0.15);
    }
    .console-msg {
      color: #e2e8f0;
      flex: 1;
    }
    .console-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      margin-right: 4px;
    }
    @media (max-width: 600px) {
      .console-terminal {
        height: 250px;
        padding: 8px 10px;
        font-size: 11px;
      }
      .console-line {
        flex-wrap: wrap;
        gap: 2px 6px;
      }
      .console-time {
        font-size: 10px;
      }
      .console-tag {
        font-size: 10px;
        padding: 0 3px;
      }
      .console-msg {
        width: 100%;
        font-size: 11px;
      }
    }

    /* Skeleton & Empty State (ex-empty-state-card) */
    .skeleton-line {
      height: 16px;
      background-color: var(--bg-subtle);
      border-radius: var(--radius-xs);
      margin-bottom: var(--space-xs);
    }

    .empty-state {
      padding: var(--space-3xl) var(--space-lg);
      text-align: center;
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
    }

    /* Modal (ex-modal-card) & Toast (ex-toast) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: var(--backdrop-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      box-shadow: var(--shadow-modal);
      max-height: 90dvh;
      overflow-y: auto;
    }

    .toast-region {
      position: fixed;
      bottom: var(--space-lg);
      right: var(--space-lg);
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      max-width: 360px;
    }

    .toast-item {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      box-shadow: var(--shadow-toast);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: -0.28px;
    }

    @media (max-width: 480px) {
      .modal-backdrop {
        padding: 10px;
      }
      .modal-box {
        padding: 18px 14px;
        border-radius: var(--radius-md);
        max-height: 88dvh;
      }
      .modal-box .card-title {
        font-size: 18px;
        line-height: 24px;
      }
      .modal-box .card-desc {
        font-size: 13px;
        line-height: 18px;
      }
      .modal-box .btn-row {
        flex-direction: column-reverse;
        gap: 8px;
        width: 100%;
      }
      .modal-box .btn-row .btn {
        width: 100%;
        min-height: 40px;
      }
      .toast-region {
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-width: none;
      }
      .toast-item {
        width: 100%;
        box-sizing: border-box;
        font-size: 13px;
        padding: 10px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Layar Login -->
  <main id="login-view" class="login-shell hidden">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="logo-crop-login">
        <img src="/kaliber.avif" alt="Logo Kaliber" width="85" height="85" decoding="async" fetchpriority="high">
      </div>
      <h1 id="login-heading" class="login-title">Kaliber Bot Admin</h1>
      <p class="login-subtitle">Masukkan token admin untuk mengelola chatbot LSO Kaliber.</p>
      <form id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="login-token-input">Token Admin</label>
          <input id="login-token-input" class="text-input mono" type="password" autocomplete="current-password" required>
          <div id="login-error" class="field-error hidden" role="alert"></div>
        </div>
        <button id="login-submit-btn" type="submit" class="btn btn-primary" style="width: 100%;">Masuk</button>
      </form>
    </section>
  </main>

  <!-- Aplikasi Utama -->
  <div id="app-view" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-group">
          <div class="logo-crop-header">
            <img src="/kaliber.avif" alt="Logo Kaliber" width="38" height="38" decoding="async">
          </div>
          <span class="brand-name">Kaliber Bot</span>
          <span id="header-bot-badge" class="badge badge-neutral">Memuat</span>
        </div>
        <div class="header-actions">
          <button id="theme-toggle-btn" type="button" class="btn btn-secondary btn-sm btn-icon" aria-label="Ganti tema" title="Ganti tema"></button>
          <button id="logout-admin-btn" type="button" class="btn btn-secondary btn-sm">Keluar</button>
        </div>
      </div>
    </header>

    <nav class="tabs-bar" aria-label="Menu utama">
      <div id="tabs-nav" class="tabs-inner" role="tablist"></div>
    </nav>

    <main id="tab-content" class="main-container"></main>
  </div>

  <!-- Datalist global untuk pilihan model -->
  <datalist id="global-models-datalist"></datalist>

  <!-- Modal Dinamis -->
  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>

  <!-- Region Toast -->
  <div id="toast-root" class="toast-region" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      var SESSION_TOKEN_KEY = 'kaliber_admin_token';
      var THEME_KEY = 'kaliber_theme';

      var TABS = [
        { id: 'ringkasan', label: 'Ringkasan' },
        { id: 'prompt', label: 'Prompt' },
        { id: 'knowledge', label: 'Knowledge' },
        { id: 'provider', label: 'Provider' },
        { id: 'model', label: 'Model' },
        { id: 'guard', label: 'Guard' },
        { id: 'ujicoba', label: 'Uji Coba' },
        { id: 'log', label: 'Log' }
      ];

      var state = {
        activeTab: 'ringkasan',
        status: null,

      /* Helper DOM berbasis createElement dan textContent */
      function createSvgIcon(type) {
        var NS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        if (type === 'up') {
          var p1 = document.createElementNS(NS, 'path');
          p1.setAttribute('d', 'M12 19V5M5 12l7-7 7 7');
          svg.appendChild(p1);
        } else if (type === 'down') {
          var p2 = document.createElementNS(NS, 'path');
          p2.setAttribute('d', 'M12 5v14M5 12l7 7 7-7');
          svg.appendChild(p2);
        } else if (type === 'close') {
          var p3 = document.createElementNS(NS, 'path');
          p3.setAttribute('d', 'M18 6L6 18M6 6l12 12');
          svg.appendChild(p3);
        } else if (type === 'plus') {
          var p4 = document.createElementNS(NS, 'path');
          p4.setAttribute('d', 'M12 5v14M5 12h14');
          svg.appendChild(p4);
        } else if (type === 'trash') {
          var pTrash = document.createElementNS(NS, 'path');
          pTrash.setAttribute('d', 'M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2');
          svg.appendChild(pTrash);
        } else if (type === 'grip') {
          var coords = [[9, 6], [9, 12], [9, 18], [15, 6], [15, 12], [15, 18]];
          for (var i = 0; i < coords.length; i++) {
            var dot = document.createElementNS(NS, 'circle');
            dot.setAttribute('cx', String(coords[i][0]));
            dot.setAttribute('cy', String(coords[i][1]));
            dot.setAttribute('r', '1.5');
            dot.setAttribute('fill', 'currentColor');
            dot.setAttribute('stroke', 'none');
            svg.appendChild(dot);
          }
        }
        return svg;
      }
      function clearEl(node) {
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
      }

      function el(tag, attrs, children) {
        var element = document.createElement(tag);
        if (attrs) {
          var keys = Object.keys(attrs);
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var v = attrs[k];
            if (v === undefined || v === null || v === false) continue;
            if (k === 'className') {
              element.className = String(v);
            } else if (k === 'textContent') {
              element.textContent = String(v);
            } else if (k === 'checked' || k === 'disabled' || k === 'readOnly' || k === 'required' || k === 'selected') {
              element[k] = Boolean(v);
            } else if (k.indexOf('on') === 0 && typeof v === 'function') {
              element.addEventListener(k.slice(2).toLowerCase(), v);
            } else {
              element.setAttribute(k, String(v));
            }
          }
        }
        if (children !== undefined && children !== null) {
          appendChildren(element, children);
        }
        return element;
      }

      function appendChildren(parent, children) {
        if (Array.isArray(children)) {
          for (var i = 0; i < children.length; i++) {
            appendChildren(parent, children[i]);
          }
        } else if (typeof children === 'string' || typeof children === 'number') {
          parent.appendChild(document.createTextNode(String(children)));
        } else if (children instanceof Node) {
          parent.appendChild(children);
        }
      }

      /* Penyimpanan Token & Tema */
      function getToken() {
        try {
          return sessionStorage.getItem(SESSION_TOKEN_KEY) || '';
        } catch (e) {
          return '';
        }
      }

      function setToken(token) {
        try {
          if (token) {
            sessionStorage.setItem(SESSION_TOKEN_KEY, token);
          } else {
            sessionStorage.removeItem(SESSION_TOKEN_KEY);
          }
        } catch (e) {}
      }

      function getCurrentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }

      function updateThemeButtonLabel() {
        var btn = document.getElementById('theme-toggle-btn');
        if (!btn) return;
        var dark = getCurrentTheme() === 'dark';
        var label = dark ? 'Beralih ke mode terang' : 'Beralih ke mode gelap';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
        clearEl(btn);
        var NS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        function add(tag, attrs) {
          var node = document.createElementNS(NS, tag);
          Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
          svg.appendChild(node);
        }
        if (dark) {
          /* Ikon matahari: menandakan tombol akan beralih ke mode terang */
          add('circle', { cx: '12', cy: '12', r: '4' });
          ['M12 2v2', 'M12 20v2', 'M4.93 4.93l1.41 1.41', 'M17.66 17.66l1.41 1.41', 'M2 12h2', 'M20 12h2', 'M6.34 17.66l-1.41 1.41', 'M19.07 4.93l-1.41 1.41'].forEach(function (d) {
            add('path', { d: d });
          });
        } else {
          add('path', { d: 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' });
        }
        btn.appendChild(svg);
      }

      function toggleTheme() {
        var next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try {

      /* Toast */
      function showToast(message) {
        var root = document.getElementById('toast-root');
        if (!root) return;
        var item = el('div', { className: 'toast-item', textContent: message });
        root.appendChild(item);
        setTimeout(function () {

            item.parentNode.removeChild(item);
          }
        }, 4000);
      }

      function closeModal() {

          clearTimeout(state.revealClearTimer);
          state.revealClearTimer = null;
        }
        var root = document.getElementById('modal-root');
        if (!root) return;
        clearEl(root);
        root.classList.add('hidden');

      function openModal(contentNode) {
        closeModal();

        root.appendChild(box);

      function openConfirmModal(opts) {
        var errBox = el('div', { className: 'field-error hidden' });
        var confirmBtn = el('button', {
          type: 'button',
          className: opts.danger ? 'btn btn-danger' : 'btn btn-primary',
          textContent: opts.confirmLabel || 'Konfirmasi',
          onClick: function () {
            confirmBtn.disabled = true;
            Promise.resolve(opts.onConfirm())
              .then(function () {
                closeModal();
              })
              .catch(function (err) {
                confirmBtn.disabled = false;
                errBox.textContent = err && err.message ? err.message : 'Gagal menjalankan aksi.';
                errBox.classList.remove('hidden');
              });
          }
        });
        var cancelBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary',

        });

          ])

      /* Pemanggilan API */
      function apiFetch(path, options) {
        var opts = options || {};
        var headers = { Accept: 'application/json' };
        var token = opts.tokenOverride !== undefined ? opts.tokenOverride : getToken();
        if (token) {
          headers.Authorization = 'Bearer ' + token;
        }
        if (opts.body !== undefined) {
          headers['Content-Type'] = 'application/json';
        }

        return fetch(path, {
          method: opts.method || 'GET',
          headers: headers,
          body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (res.status === 401) {
              if (!opts.skipAuthRedirect) {
                handleUnauthorized();
              }
              var err401 = new Error(data.error || 'Token tidak valid.');
              err401.status = 401;
              throw err401;
            }
            if (res.status === 429) {
              var err429 = new Error('Terlalu banyak percobaan, coba lagi nanti.');
              err429.status = 429;
              throw err429;
            }
            if (!res.ok) {
              var err = new Error(data.error || data.message || ('Permintaan gagal (HTTP ' + res.status + ')'));
              err.status = res.status;
              throw err;
            }
            return data;
          });
        });
      }

      /* Login & Sesi */
      function handleUnauthorized() {
        stopSummaryAutoRefresh();
        setToken('');
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
      }

      function showApp() {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');

        switchTab(state.activeTab);

      function updateHeaderBadge() {
        var badge = document.getElementById('header-bot-badge');
        if (!badge) return;
        var botOn = state.status ? Boolean(state.status.botEnabled) : (state.settings ? Boolean(state.settings.bot_enabled) : false);
        badge.textContent = botOn ? 'Bot Aktif' : 'Bot Nonaktif';
        badge.className = 'badge ' + (botOn ? 'badge-success' : 'badge-neutral');
      }

      function populateGlobalModelsDatalist() {
        var dl = document.getElementById('global-models-datalist');
        if (!dl) return;
        clearEl(dl);
        var seen = {};
        for (var i = 0; i < state.modelsList.length; i++) {
          var group = state.modelsList[i];
          var provName = group.provider || '';
          var arr = Array.isArray(group.models) ? group.models : [];
          for (var j = 0; j < arr.length; j++) {
            var m = arr[j];
            var full = provName ? (provName + '/' + m) : m;
            if (!seen[full]) {
              seen[full] = true;
              dl.appendChild(el('option', { value: full }));
            }
            if (!seen[m]) {
              seen[m] = true;
              dl.appendChild(el('option', { value: m }));
            }
          }
        }
      }

      /* Navigasi Tab */
      function renderTabsNav() {
        var nav = document.getElementById('tabs-nav');
        if (!nav) return;
        clearEl(nav);
        for (var i = 0; i < TABS.length; i++) {
          (function (tab) {
            var btn = el('button', {
              type: 'button',

              'aria-selected': state.activeTab === tab.id ? 'true' : 'false',

              }
            });
            nav.appendChild(btn);
          })(TABS[i]);

      function stopSummaryAutoRefresh() {
        if (state.summaryTimer) {
          clearInterval(state.summaryTimer);
          state.summaryTimer = null;
        }
      }

      function startSummaryAutoRefresh() {
        stopSummaryAutoRefresh();
        state.summaryTimer = setInterval(function () {
          if (state.activeTab === 'ringkasan' && document.visibilityState === 'visible') {
            refreshSummarySilent();
          }
        }, 5000);
      }

      function stopConsoleAutoRefresh() {
        if (state.consoleTimer) {
          clearInterval(state.consoleTimer);
          state.consoleTimer = null;
        }
      }

      function startConsoleAutoRefresh() {
        stopConsoleAutoRefresh();
        state.consoleTimer = setInterval(function () {
          if (state.activeTab === 'log' && document.visibilityState === 'visible') {
            pollConsoleSilent();
            pollLogsSilent();
          }
        }, 2000);
      }

      function pollLogsSilent() {
        if (state.activeTab !== 'log') return;
        apiFetch('/api/logs')
          .then(function (res) {
            if (state.activeTab !== 'log') return;
            var newLogs = Array.isArray(res) ? res : ((res && res.logs) || []);
            var hasChanged = false;
            if (newLogs.length !== state.logs.length) {
              hasChanged = true;
            } else if (newLogs.length > 0) {
              if (newLogs[0].id !== (state.logs[0] && state.logs[0].id) ||
                  newLogs[newLogs.length - 1].id !== (state.logs[state.logs.length - 1] && state.logs[state.logs.length - 1].id)) {
                hasChanged = true;
              }
            }
            if (hasChanged) {
              state.logs = newLogs;
              var tableContainer = document.getElementById('activity-logs-container');
              if (tableContainer) {
                renderActivityLogsTable(tableContainer);
              }
              var clearBtn = document.getElementById('clear-logs-btn');
              if (clearBtn) {
                clearBtn.disabled = state.logs.length === 0;
              }
            }
          })
          .catch(function () {});
      }

      function pollConsoleSilent() {
        var terminal = document.querySelector('.console-terminal');
        apiFetch('/api/console?since=' + (state.consoleLastId || 0))
          .then(function (res) {
            if (state.activeTab !== 'log') return;
            var items = (res && res.logs) || [];
            if (items.length > 0) {
              var isFirst = state.consoleLogs.length === 0;
              if (isFirst && terminal) {
                clearEl(terminal);
              }
              var isAtBottom = terminal ? (terminal.scrollTop + terminal.clientHeight >= terminal.scrollHeight - 40) : true;
              for (var i = 0; i < items.length; i++) {
                var it = items[i];
                state.consoleLogs.push(it);
                if (it.id > state.consoleLastId) {
                  state.consoleLastId = it.id;
                }
                if (terminal) {
                  appendConsoleLine(terminal, it);
                }
              }
              if (terminal && isAtBottom) {
                terminal.scrollTop = terminal.scrollHeight;
              }
            }
          })
          .catch(function () {});
      }

      function switchTab(tabId) {
        state.activeTab = tabId;
        stopSummaryAutoRefresh();
        stopConsoleAutoRefresh();
        renderTabsNav();
        var container = document.getElementById('tab-content');
        if (!container) return;

        if (tabId === 'ringkasan') {
          loadSummaryTab(container);
          startSummaryAutoRefresh();
        } else if (tabId === 'prompt') {
          loadSettingsTab(container, renderPromptTab);
        } else if (tabId === 'knowledge') {
          loadSettingsTab(container, renderKnowledgeTab);
        } else if (tabId === 'provider') {
          loadProviderTab(container);
        } else if (tabId === 'model') {
          loadSettingsTab(container, renderModelTab);
        } else if (tabId === 'guard') {
          loadSettingsTab(container, renderGuardTab);
        } else if (tabId === 'ujicoba') {
          renderUjiCobaTab(container);
        } else if (tabId === 'log') {
          loadLogTab(container);

      function renderSkeleton(container) {

          ])
        );

      function formatDuration(sec) {
        var s = Math.max(0, Math.floor(Number(sec) || 0));
        var d = Math.floor(s / 86400);
        var h = Math.floor((s % 86400) / 3600);
        var m = Math.floor((s % 3600) / 60);
        var rem = s % 60;
        var parts = [];
        if (d > 0) parts.push(d + ' hari');
        if (h > 0 || d > 0) parts.push(h + ' jam');
        if (m > 0 || h > 0 || d > 0) parts.push(m + ' mnt');
        parts.push(rem + ' dtk');
        return parts.join(' ');
      }

      function formatTimestamp(ms) {
        if (!ms) return '-';
        try {
          return new Date(ms).toLocaleString('id-ID', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        } catch (e) {
          return String(ms);
        }
      }

      /* PEMUAT PENGATURAN UMUM */
      function loadSettingsTab(container, renderFn) {
        renderSkeleton(container);
        apiFetch('/api/settings')
          .then(function (data) {
            state.settings = data.settings;
            state.defaults = data.defaults;
            if (data.limits) state.limits = data.limits;
            state.hasRevealPassword = Boolean(data.has_reveal_password);
            updateHeaderBadge();
            renderFn(container);
          })
          .catch(function (err) {
            clearEl(container);
            container.appendChild(
              el('div', { className: 'card-base' }, [
                el('div', { className: 'field-error', textContent: err.message || 'Gagal memuat pengaturan.' }),
                el('button', {
                  type: 'button',
                  className: 'btn btn-secondary',
                  style: 'margin-top: 12px;',
                  textContent: 'Muat ulang',
                  onClick: function () { loadSettingsTab(container, renderFn); }
                })
              ])
            );
          });
      }

      function computeChangedSettings(draft, original) {
        var patch = {};
        var keys = Object.keys(draft);
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          if (JSON.stringify(draft[k]) !== JSON.stringify(original[k])) {
            patch[k] = draft[k];
          }
        }
        return patch;
      }

      /* TAB 2: PROMPT */
      function renderPromptTab(container) {
        clearEl(container);
        var s = state.settings;
        var def = state.defaults || {};

        var dirtyBadge = el('span', { className: 'badge badge-warn hidden', textContent: 'Belum disimpan' });
        var errorBanner = el('div', { className: 'field-error hidden', role: 'alert' });
        var sysCounter = el('span', { className: 'field-hint mono' });

        var sysInput = el('textarea', {
          id: 'prompt-system-input',
          className: 'textarea-input mono',
          rows: '12',
          maxLength: '20000'
        });
        sysInput.value = s.system_prompt || '';

        var contactInput = el('input', {
          id: 'prompt-contact-input',
          type: 'text',
          className: 'text-input',
          maxLength: '200',
          value: s.contact || ''
        });

        var fallbackInput = el('textarea', {
          id: 'prompt-fallback-input',
          className: 'textarea-input',
          rows: '2',
          maxLength: '2000'
        });
        fallbackInput.value = s.fallback_text || '';

        var refusalInput = el('textarea', {
          id: 'prompt-refusal-input',
          className: 'textarea-input',
          rows: '2',
          maxLength: '2000'
        });
        refusalInput.value = s.refusal_text || '';

        var infoInput = el('textarea', {
          id: 'prompt-info-input',
          className: 'textarea-input',
          rows: '3',
          maxLength: '2000'
        });
        infoInput.value = s.info_text || '';

        var helpInput = el('textarea', {
          id: 'prompt-help-input',
          className: 'textarea-input',
          rows: '4',
          maxLength: '2000'
        });
        helpInput.value = s.help_text || '';

        function getDraft() {
          return {
            system_prompt: sysInput.value,
            contact: contactInput.value,
            fallback_text: fallbackInput.value,
            refusal_text: refusalInput.value,
            info_text: infoInput.value,
            help_text: helpInput.value
          };
        }

        function syncDirty() {
          sysCounter.textContent = sysInput.value.length + ' / 20000 karakter';
          var patch = computeChangedSettings(getDraft(), state.settings);
          if (Object.keys(patch).length > 0) {
            dirtyBadge.classList.remove('hidden');
          } else {
            dirtyBadge.classList.add('hidden');
          }
        }

        [sysInput, contactInput, fallbackInput, refusalInput, infoInput, helpInput].forEach(function (inp) {
          inp.addEventListener('input', syncDirty);
        });
        syncDirty();

        var saveBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Simpan',
          onClick: function () {
            var patch = computeChangedSettings(getDraft(), state.settings);
            if (Object.keys(patch).length === 0) {
              showToast('Tidak ada perubahan untuk disimpan.');
              return;
            }
            errorBanner.classList.add('hidden');
            saveBtn.disabled = true;
            apiFetch('/api/settings', { method: 'PUT', body: patch })
              .then(function (res) {
                state.settings = res.settings;
                syncDirty();
                showToast('Pengaturan prompt disimpan.');
              })
              .catch(function (err) {
                errorBanner.textContent = err.message || 'Gagal menyimpan pengaturan.';
                errorBanner.classList.remove('hidden');
              })
              .finally(function () {
                saveBtn.disabled = false;
              });
          }
        });

        var resetBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary',
          textContent: 'Reset',
          onClick: function () {
            openConfirmModal({
              title: 'Reset Pengaturan Prompt',
              message: 'Kembalikan system prompt, kontak, dan seluruh teks balasan ke nilai bawaan?',
              confirmLabel: 'Reset',
              danger: true,
              onConfirm: function () {
                sysInput.value = def.system_prompt || '';
                contactInput.value = def.contact || '';
                fallbackInput.value = def.fallback_text || '';
                refusalInput.value = def.refusal_text || '';
                infoInput.value = def.info_text || '';
                helpInput.value = def.help_text || '';
                syncDirty();
              }
            });
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Instruksi Sistem dan Teks Balasan' }),
              el('p', {
                className: 'card-desc',
                textContent: 'Atur kepribadian asisten, kontak pengurus, dan pesan standar.'
              })
            ]),
            dirtyBadge
          ]),
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'prompt-system-input' }, [
              el('span', { textContent: 'System Prompt' }),
              sysCounter
            ]),
            sysInput,
            el('p', {
              className: 'field-hint mono',
              textContent: 'Placeholder tersedia: {{NOW}} {{CONTACT}} {{KNOWLEDGE}}'
            })
          ]),
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'prompt-contact-input', textContent: 'Kontak Pengurus ({{CONTACT}})' }),
            contactInput
          ]),
          el('div', { className: 'form-grid-2' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'prompt-fallback-input', textContent: 'Teks Saat LLM Sibuk / Gagal (fallback_text)' }),
              fallbackInput
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'prompt-refusal-input', textContent: 'Teks Penolakan Injeksi (refusal_text)' }),
              refusalInput
            ])
          ]),
          el('div', { className: 'form-grid-2' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'prompt-info-input', textContent: 'Balasan Perintah !info (info_text)' }),
              infoInput
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'prompt-help-input', textContent: 'Balasan Perintah !help (help_text)' }),
              helpInput
            ])
          ]),
          errorBanner,
          el('div', { className: 'form-footer' }, [
            resetBtn,
            saveBtn
          ])
        ]);

        container.appendChild(card);
      }

      /* TAB 3: KNOWLEDGE */
      function renderKnowledgeTab(container) {
        clearEl(container);
        var s = state.settings;
        var warnLimit = (state.limits && state.limits.knowledge_warn_chars) || 12000;
        var dirtyBadge = el('span', { className: 'badge badge-warn hidden', textContent: 'Belum disimpan' });
        var counterEl = el('span', { className: 'field-hint mono' });
        var warnBanner = el('div', {
          className: 'field-warn hidden',
          textContent: 'Ukuran knowledge melewati ' + warnLimit + ' karakter. Ukuran yang terlalu besar dapat meningkatkan konsumsi token dan latensi.'
        });
        var errorBanner = el('div', { className: 'field-error hidden', role: 'alert' });

        var knowInput = el('textarea', {
          id: 'knowledge-editor-input',
          className: 'textarea-input mono',
          rows: '18',
          maxLength: '50000'
        });
        knowInput.value = s.knowledge || '';

        function syncKnowledgeState() {
          var len = knowInput.value.length;
          counterEl.textContent = len + ' / 50000 karakter';
          if (len > warnLimit) {
            warnBanner.classList.remove('hidden');
          } else {
            warnBanner.classList.add('hidden');
          }
          if (knowInput.value !== (state.settings.knowledge || '')) {
            dirtyBadge.classList.remove('hidden');
          } else {
            dirtyBadge.classList.add('hidden');
          }
        }

        knowInput.addEventListener('input', syncKnowledgeState);
        syncKnowledgeState();

        var saveBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Simpan',
          onClick: function () {
            if (knowInput.value === state.settings.knowledge) {
              showToast('Tidak ada perubahan untuk disimpan.');
              return;
            }
            errorBanner.classList.add('hidden');
            saveBtn.disabled = true;
            apiFetch('/api/settings', { method: 'PUT', body: { knowledge: knowInput.value } })
              .then(function (res) {
                state.settings = res.settings;
                syncKnowledgeState();
                showToast('Knowledge base berhasil disimpan.');
              })
              .catch(function (err) {
                errorBanner.textContent = err.message || 'Gagal menyimpan knowledge base.';
                errorBanner.classList.remove('hidden');
              })
              .finally(function () {
                saveBtn.disabled = false;
              });
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Knowledge Base LSO Kaliber' }),
              el('p', {
                className: 'card-desc',
                textContent: 'Isi materi resmi organisasi yang menjadi satu-satunya sumber jawaban bot.'
              })
            ]),
            dirtyBadge
          ]),
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'knowledge-editor-input' }, [
              el('span', { textContent: 'Dokumen Knowledge ({{KNOWLEDGE}})' }),
              counterEl
            ]),
            knowInput,
            warnBanner,
            errorBanner
          ]),
          el('div', { className: 'form-footer', style: 'justify-content: flex-end;' }, [saveBtn])

        container.appendChild(card);

      /* TAB 4: PROVIDER */
      function loadProviderTab(container) {
        renderSkeleton(container);
        Promise.all([
          apiFetch('/api/providers'),
          apiFetch('/api/settings')
        ])
          .then(function (results) {
            state.providersData = results[0];
            state.settings = results[1].settings;
            state.defaults = results[1].defaults;
            state.hasRevealPassword = Boolean(results[1].has_reveal_password);
            if (state.activeTab === 'provider') {
              renderProviderTab(container);
            }
          })
          .catch(function (err) {
            clearEl(container);
            container.appendChild(
              el('div', { className: 'card-base' }, [
                el('div', { className: 'field-error', textContent: err.message || 'Gagal memuat daftar provider.' }),
                el('button', {
                  type: 'button',
                  className: 'btn btn-secondary',
                  style: 'margin-top: 12px;',
                  textContent: 'Muat ulang',
                  onClick: function () { loadProviderTab(container); }
                })
              ])
            );
          });
