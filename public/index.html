      function mapKeyStatusBadge(status) {
        if (status === 'valid') return { text: 'Valid', cls: 'badge-success' };
        if (status === 'invalid') return { text: 'Ditolak', cls: 'badge-error' };
        if (status === 'rate_limited') return { text: 'Kena limit', cls: 'badge-warn' };
        if (status === 'unreachable') return { text: 'Tidak terjangkau', cls: 'badge-warn' };
        if (status === 'error') return { text: 'Error', cls: 'badge-error' };
        return { text: 'Belum dites', cls: 'badge-neutral' };
      }

      function renderProviderTab(container) {
        clearEl(container);
        var pData = state.providersData || { providers: [], maxProviders: 5, maxKeysPerProvider: 5, serverNow: Date.now() };
        var providers = pData.providers || [];
        var maxProv = pData.maxProviders || 5;
        var maxKeys = pData.maxKeysPerProvider || 5;
        var serverNow = pData.serverNow || Date.now();
        /* Tombol Tes Semua Key */
        var testAllStatus = el('span', { className: 'field-hint' });
        var testAllBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Tes semua key',
          onClick: function () {
            var queue = [];
            for (var i = 0; i < providers.length; i++) {
              var p = providers[i];
              var pKeys = p.keys || [];
              for (var j = 0; j < pKeys.length; j++) {
                queue.push({ providerId: p.id, keyId: pKeys[j].id, label: p.name + '/' + pKeys[j].label });
              }
            }
            if (queue.length === 0) {
              showToast('Belum ada API key yang tersimpan untuk dites.');
              return;
            }
            testAllBtn.disabled = true;
            var idx = 0;
            function next() {
              if (idx >= queue.length) {
                testAllBtn.disabled = false;
                testAllStatus.textContent = 'Selesai menguji ' + queue.length + ' key.';
                loadProviderTab(container);
                return;
              }
              var item = queue[idx++];
              testAllStatus.textContent = 'Menguji ' + idx + '/' + queue.length + ' (' + item.label + ')...';
              apiFetch('/api/providers/' + item.providerId + '/keys/' + item.keyId + '/test', { method: 'POST' })
                .catch(function () {})
                .then(function () {
                  return apiFetch('/api/providers').then(function (fresh) {
                    state.providersData = fresh;
                  }).catch(function () {});
                })
                .then(function () {
                  next();
                });
            }
            next();
          }
        });

        var addProviderBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary btn-sm',
          disabled: providers.length >= maxProv,
          textContent: 'Tambah provider',
          onClick: function () {
            openAddProviderModal(container);
          }
        });

        var listWrap = el('div', { className: 'provider-list' });
        if (providers.length === 0) {
          listWrap.appendChild(
            el('div', {
              className: 'empty-state',
              style: 'margin-top: 16px;',
              textContent: 'Belum ada provider LLM. Klik "Tambah provider", pilih format OpenAI-compatible atau Anthropic, lalu isi Base URL dan API key.'
            })
          );
        } else {
          for (var i = 0; i < providers.length; i++) {
            listWrap.appendChild(buildProviderBlock(providers[i], maxKeys, serverNow, container));
          }
        }

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', {
                className: 'card-title',
                textContent: 'Provider dan API key (' + providers.length + '/' + maxProv + ')'
              }),
              el('p', {
                className: 'card-desc',
                textContent: 'Maksimal ' + maxProv + ' provider dan ' + maxKeys + ' API key per provider.'
              })
            ]),
            el('div', { className: 'btn-row' }, [
              testAllStatus,
              testAllBtn,
              addProviderBtn
            ])
          ]),
          listWrap
        ]);

        container.appendChild(card);
      }

      function buildProviderBlock(p, maxKeys, serverNow, container) {
        var hasKeys = Array.isArray(p.keys) && p.keys.length > 0;
        var inlineFeedback = el('div', { className: 'hidden' });

        var nameInput = el('input', {
          type: 'text',
          className: 'text-input mono',
          value: p.name
        });
        var urlInput = el('input', {
          type: 'url',
          className: 'text-input mono',
          value: p.baseUrl,
          readOnly: hasKeys
        });
        var formatInput = el('select', { className: 'select-input' }, [
          el('option', { value: 'openai', selected: p.format !== 'anthropic', textContent: 'OpenAI-compatible' }),
          el('option', { value: 'anthropic', selected: p.format === 'anthropic', textContent: 'Anthropic' })
        ]);
        var toggleInput = el('input', {
          type: 'checkbox',
          className: 'switch-input',
          checked: p.enabled,
          'aria-label': 'Aktifkan provider ' + p.name,
          onChange: function () {
            apiFetch('/api/providers/' + p.id + '/toggle', {
              method: 'POST',
              body: { enabled: toggleInput.checked }
            })
              .then(function () {
                showToast('Status provider ' + p.name + ' diperbarui.');
                loadProviderTab(container);
              })
              .catch(function (err) {
                toggleInput.checked = !toggleInput.checked;
                showToast(err.message || 'Gagal mengubah status provider.');
              });
          }
        });

        var saveProvBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Simpan',
          onClick: function () {
            inlineFeedback.className = 'hidden';
            var payload = {
              name: nameInput.value.trim(),
              format: formatInput.value
            };
            if (!hasKeys) {
              payload.baseUrl = urlInput.value.trim();
            }
            apiFetch('/api/providers/' + p.id, { method: 'PUT', body: payload })
              .then(function () {
                showToast('Provider ' + payload.name + ' disimpan.');
                loadProviderTab(container);
              })
              .catch(function (err) {
                inlineFeedback.className = 'field-error';
                inlineFeedback.textContent = err.message || 'Gagal memperbarui provider.';
              });
          }
        });

        var testProvBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Tes koneksi',
          onClick: function () {
            testProvBtn.disabled = true;
            inlineFeedback.className = 'field-hint';
            inlineFeedback.textContent = 'Menguji koneksi provider...';
            apiFetch('/api/providers/' + p.id + '/test', { method: 'POST' })
              .then(function (res) {
                inlineFeedback.className = res.ok ? 'field-success' : 'field-error';
                inlineFeedback.textContent = res.message + ' (' + res.latencyMs + ' ms)';
                return apiFetch('/api/providers').then(function (fresh) {
                  state.providersData = fresh;
                });
              })
              .catch(function (err) {
                inlineFeedback.className = 'field-error';
                inlineFeedback.textContent = err.message || 'Gagal menguji provider.';
              })
              .finally(function () {
                testProvBtn.disabled = false;
              });
          }
        });

        var modelsPanel = el('div', { className: 'hidden' });

        function renderModelsPanel(list) {
          clearEl(modelsPanel);
          if (!list.length) {
            modelsPanel.className = 'hidden';
            return;
          }
          modelsPanel.className = 'models-panel';
          var tbody = el('tbody');
          var searchInp = el('input', {
            type: 'search',
            className: 'text-input mono',
            placeholder: 'Cari model...',
            'aria-label': 'Cari model'
          });
          var countLabel = el('span', { className: 'field-hint' });

          function paintRows() {
            var q = searchInp.value.trim().toLowerCase();
            clearEl(tbody);
            var shown = 0;
            list.forEach(function (name, idx) {
              if (q && name.toLowerCase().indexOf(q) === -1) return;
              shown++;
              tbody.appendChild(
                el('tr', null, [
                  el('td', { className: 'mono', textContent: String(idx + 1) }),
                  el('td', { className: 'mono', textContent: name })
                ])
              );
            });
            countLabel.textContent = shown + ' dari ' + list.length + ' model';
            if (shown === 0) {
              tbody.appendChild(
                el('tr', null, [el('td', { colSpan: '2', className: 'field-hint', textContent: 'Tidak ada model yang cocok.' })])
              );
            }
          }

          searchInp.addEventListener('input', paintRows);
          paintRows();

          modelsPanel.appendChild(el('div', { className: 'models-panel-head' }, [
            el('strong', { textContent: 'Model tersedia' }),
            countLabel,
            searchInp
          ]));
          modelsPanel.appendChild(el('div', { className: 'models-scroll' }, [
            el('table', { className: 'models-table' }, [
              el('thead', null, [
                el('tr', null, [
                  el('th', { textContent: 'No' }),
                  el('th', { textContent: 'Model' })
                ])
              ]),
              tbody
            ])
          ]));
        }

        var viewModelsBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Lihat model',
          onClick: function () {
            viewModelsBtn.disabled = true;
            inlineFeedback.className = 'field-hint';
            inlineFeedback.textContent = 'Memuat daftar model dari ' + p.name + '...';
            clearEl(modelsPanel);
            modelsPanel.className = 'hidden';
            apiFetch('/api/providers/' + p.id + '/models')
              .then(function (res) {

                if (res.error) {
                  inlineFeedback.className = 'field-warn';
                  inlineFeedback.textContent = 'Peringatan model (' + res.error + '). ' + (list.length ? 'Menampilkan model tersimpan.' : 'Daftar kosong.');
                } else {
                  inlineFeedback.className = 'hidden';
                }
                renderModelsPanel(list);
                state.modelsList = [{ provider: p.name, models: list }];
                populateGlobalModelsDatalist();
              })
              .catch(function (err) {
                inlineFeedback.className = 'field-error';
                inlineFeedback.textContent = err.message || 'Gagal mengambil daftar model.';
              })
              .finally(function () {
                viewModelsBtn.disabled = false;
              });
          }
        });

          type: 'button',
          className: 'btn btn-danger btn-sm',

              testProvBtn,

            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Nama Provider' }),

      function buildKeyRow(provider, k, serverNow, container) {

        var keyToggle = el('input', {

                  showToast('API key dihapus.');

          ]),
          el('div', { className: 'btn-row' }, [

      /* TAB 5: MODEL */
      function renderModelTab(container) {
        clearEl(container);
        var s = state.settings;
        var dirtyBadge = el('span', { className: 'badge badge-warn hidden', textContent: 'Belum disimpan' });
        var errorBanner = el('div', { className: 'field-error hidden', role: 'alert' });
        var pingResultBox = el('div', { className: 'hidden' });

        /* Otomatis muat daftar model dari provider jika belum ada */
        if (!state.modelsList || state.modelsList.length === 0) {
          apiFetch('/api/models')
            .then(function (list) {
              state.modelsList = Array.isArray(list) ? list : [];
              populateGlobalModelsDatalist();
            })
            .catch(function () {});
        }

        /* Urutan model: indeks 0 adalah Model Utama, indeks 1..19 adalah Model Cadangan */
        var modelList = [];
        if (s.model && s.model.trim()) {
          modelList.push(s.model.trim());
        }
        if (Array.isArray(s.fallback_models)) {
          for (var i = 0; i < s.fallback_models.length; i++) {
            var fm = s.fallback_models[i].trim();
            if (fm && modelList.indexOf(fm) === -1) {
              modelList.push(fm);
            }
          }
        }
        if (modelList.length > 20) {
          modelList = modelList.slice(0, 20);
        }

        var tempInp = el('input', {
          id: 'model-temp-input',
          type: 'number',
          step: '0.1',
          min: '0',
          max: '2',
          className: 'text-input mono',
          value: String(s.temperature)
        });

        var tokensInp = el('input', {
          id: 'model-tokens-input',
          type: 'number',
          min: '1',
          max: '2000',
          className: 'text-input mono',
          value: String(s.max_tokens)
        });

        var turnsInp = el('input', {
          id: 'model-turns-input',
          type: 'number',
          min: '0',
          max: '20',
          className: 'text-input mono',
          value: String(s.history_turns)
        });

        var modeSelect = el('select', {
          id: 'model-mode-input',
          className: 'select-input'
        }, [
          el('option', { value: 'fallback', textContent: 'Fallback (Prioritas urut nomor 1 ke bawah)' }),
          el('option', { value: 'round_robin', textContent: 'Round Robin (Bergiliran tiap pesan masuk)' }),
          el('option', { value: 'fusion', textContent: 'Fusion (Sintesis paralel dari beberapa model)' })
        ]);
        modeSelect.value = s.model_mode || 'fallback';

        var modeHint = el('div', { className: 'field-hint', style: 'margin-top: 4px;' });
        function updateModeHint() {
          var v = modeSelect.value;
          if (v === 'round_robin') {
            modeHint.textContent = 'Mode Round Robin: Model nomor 1 sampai N dipanggil bergiliran untuk meratakan beban. Jika model terpilih gagal, otomatis beralih ke model berikutnya.';
          } else if (v === 'fusion') {
            modeHint.textContent = 'Mode Fusion: Pertanyaan dikirim bersamaan ke beberapa model teratas secara paralel, lalu hasilnya disintesis oleh model utama menjadi satu jawaban terbaik.';
          } else {
            modeHint.textContent = 'Mode Fallback: Model dipanggil berurutan mulai dari nomor 1. Jika gagal, otomatis beralih ke nomor 2, 3, dan seterusnya.';
          }
        }
        updateModeHint();

        modeSelect.addEventListener('change', function () {
          updateModeHint();
          renderModelsUi();
          syncDirty();
        });

        function getDraft() {
          return {
            model: modelList[0] || '',
            fallback_models: modelList.slice(1),
            model_mode: modeSelect.value || 'fallback',
            temperature: Number.parseFloat(tempInp.value),
            max_tokens: Number.parseInt(tokensInp.value, 10),
            history_turns: Number.parseInt(turnsInp.value, 10)
          };
        }

        function syncDirty() {
          var patch = computeChangedSettings(getDraft(), state.settings);
          if (Object.keys(patch).length > 0) {
            dirtyBadge.classList.remove('hidden');
          } else {
            dirtyBadge.classList.add('hidden');
          }
        }

        [tempInp, tokensInp, turnsInp].forEach(function (inp) {
          inp.addEventListener('input', syncDirty);
        });

        var listWrap = el('div', { className: 'model-priority-list' });
        var adderSlot = el('div', { style: 'margin-top: 8px;' });
        var countBadge = el('span', { className: 'field-hint mono' });

        function renderModelsUi() {
          clearEl(listWrap);
          clearEl(adderSlot);
          countBadge.textContent = modelList.length + ' / 20 model';

          if (modelList.length === 0) {
            listWrap.appendChild(
              el('div', {
                className: 'empty-state',
                style: 'padding: 24px 16px;',
                textContent: 'Belum ada model yang dipilih. Klik Tambah Model di bawah untuk menambahkan model utama.'
              })
            );
          } else {
            modelList.forEach(function (name, idx) {
              var isPrimary = idx === 0;

              var grip = el('span', { className: 'model-priority-grip' }, [createSvgIcon('grip')]);
              var num = el('span', { className: 'model-priority-num', textContent: String(idx + 1) });
              var nameSpan = el('span', { className: 'model-priority-name', textContent: name });

              var currentMode = modeSelect ? modeSelect.value : (s.model_mode || 'fallback');
              var tagText = '';
              var tagCls = 'badge-neutral';
              if (currentMode === 'round_robin') {
                tagText = 'Rotasi #' + (idx + 1);
                tagCls = 'badge-primary';
              } else if (currentMode === 'fusion') {
                tagText = isPrimary ? 'Juri / Sintesis' : ('Panel #' + idx);
                tagCls = isPrimary ? 'badge-success' : 'badge-neutral';
              } else {
                tagText = isPrimary ? 'Utama' : ('Cadangan #' + idx);
                tagCls = isPrimary ? 'badge-success' : 'badge-neutral';
              }

              var tagBadge = el('span', {
                className: 'badge ' + tagCls,
                textContent: tagText
              });

              var left = el('div', { className: 'model-priority-left' }, [grip, num, nameSpan, tagBadge]);

              var upBtn = el('button', {
                type: 'button',
                className: 'btn-icon-sm',
                title: 'Naikkan prioritas',
                disabled: idx === 0,
                onClick: function () {
                  var tmp = modelList[idx];
                  modelList[idx] = modelList[idx - 1];
                  modelList[idx - 1] = tmp;
                  renderModelsUi();
                  syncDirty();
                }
              }, [createSvgIcon('up')]);

              var downBtn = el('button', {
                type: 'button',
                className: 'btn-icon-sm',
                title: 'Turunkan prioritas',
                disabled: idx === modelList.length - 1,
                onClick: function () {
                  var tmp = modelList[idx];
                  modelList[idx] = modelList[idx + 1];
                  modelList[idx + 1] = tmp;
                  renderModelsUi();
                  syncDirty();
                }
              }, [createSvgIcon('down')]);

              var delBtn = el('button', {
                type: 'button',
                className: 'btn-icon-sm danger',
                title: 'Hapus model',
                onClick: function () {
                  modelList.splice(idx, 1);
                  renderModelsUi();
                  syncDirty();
                }
              }, [createSvgIcon('close')]);

              var actions = el('div', { className: 'model-priority-actions' }, [upBtn, downBtn, delBtn]);

              listWrap.appendChild(
                el('div', { className: 'model-priority-item' }, [left, actions])
              );
            });
          }

          if (modelList.length >= 20) {
            adderSlot.appendChild(
              el('div', {
                className: 'model-add-dashed',
                style: 'cursor: not-allowed; opacity: 0.5;',
                textContent: 'Maksimal 20 model tercapai'
              })
            );
          } else {
            renderAddButton();
          }
        }

        function renderAddButton() {
          clearEl(adderSlot);
          var addBtn = el('button', {
            type: 'button',
            className: 'model-add-dashed',
            onClick: function () {
              renderAddForm();
            }

      /* TAB 7: UJI COBA */
      function mapStatusBadge(st) {
        if (st === 'ok') return { text: 'ok', cls: 'badge-success' };
        if (st === 'injection' || st === 'blocked' || st === 'error') return { text: st, cls: 'badge-error' };
        if (st === 'ratelimit') return { text: st, cls: 'badge-warn' };
        return { text: st || 'info', cls: 'badge-neutral' };
      }

      function renderUjiCobaTab(container) {
        clearEl(container);
        var transcript = el('div', { className: 'chat-transcript' });
        var errorBox = el('div', { className: 'field-error hidden' });

        function renderTranscriptItems() {
          clearEl(transcript);
          if (state.chatHistory.length === 0) {
            transcript.appendChild(
              el('div', {
                className: 'empty-state',
                textContent: 'Belum ada pesan uji coba. Ketik pesan di bawah lalu tekan Enter untuk menguji alur pipeline tanpa mengirim ke WhatsApp.'
              })
            );
            return;
          }
          for (var i = 0; i < state.chatHistory.length; i++) {
            var item = state.chatHistory[i];
            if (item.role === 'user') {
              transcript.appendChild(
                el('div', { className: 'chat-item' }, [
                  el('div', { className: 'chat-role', textContent: 'Pengguna (admin-test)' }),
                  el('div', { className: 'chat-bubble', textContent: item.text })
                ])
              );
            } else {
              var b = mapStatusBadge(item.status);
              var metaChildren = [
                el('span', { className: 'badge ' + b.cls, textContent: b.text }),
                el('span', { className: 'mono', textContent: (item.latencyMs || 0) + ' ms' })
              ];
              if (item.model) {
                metaChildren.push(el('span', { className: 'mono', textContent: 'Model: ' + item.model }));
              }
              if (Array.isArray(item.flags) && item.flags.length > 0) {
                metaChildren.push(el('span', { className: 'mono', textContent: 'Flags: ' + item.flags.join(', ') }));
              }
              transcript.appendChild(
                el('div', { className: 'chat-item' }, [
                  el('div', { className: 'chat-role', textContent: 'Kaliber Bot' }),
                  el('div', { className: 'chat-bubble', textContent: item.reply || '(Tidak ada balasan teks)' }),
                  el('div', { className: 'chat-meta' }, metaChildren)
                ])
              );
            }
          }
          transcript.scrollTop = transcript.scrollHeight;
        }

        renderTranscriptItems();

        var chatInput = el('textarea', {
          id: 'test-chat-input',
          className: 'textarea-input',
          rows: '3',
          placeholder: 'Tulis pesan uji coba di sini... (Enter untuk kirim, Shift+Enter baris baru)'
        });

        var sendBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Kirim'
        });

        function submitTestMessage() {
          var text = chatInput.value.trim();
          if (!text || sendBtn.disabled) return;
          errorBox.classList.add('hidden');
          chatInput.value = '';
          state.chatHistory.push({ role: 'user', text: text });
          renderTranscriptItems();

          sendBtn.disabled = true;
          sendBtn.textContent = 'Memproses...';
          apiFetch('/api/test', { method: 'POST', body: { text: text } })
            .then(function (res) {
              state.chatHistory.push({
                role: 'assistant',
                reply: res.reply,
                status: res.status,
                flags: res.flags || [],
                model: res.model,
                latencyMs: res.latencyMs
              });
              renderTranscriptItems();
            })
            .catch(function (err) {
              errorBox.textContent = err.message || 'Gagal menjalankan simulasi pesan.';
              errorBox.classList.remove('hidden');
            })
            .finally(function () {
              sendBtn.disabled = false;
              sendBtn.textContent = 'Kirim';
              chatInput.focus();
            });
        }

        sendBtn.addEventListener('click', submitTestMessage);
        chatInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submitTestMessage();
          }
        });

        var clearBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Bersihkan',
          onClick: function () {
            state.chatHistory = [];
            renderTranscriptItems();
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Simulasi Pipeline Pesan' }),
              el('p', {
                className: 'card-desc',
                textContent: 'Menguji normalisasi, batas panjang karakter, deteksi injeksi, prompt, dan LLM. Riwayat percakapan di layar ini hanya tersimpan di memori halaman.'
              })
            ]),
            clearBtn
          ]),
          transcript,
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'test-chat-input', textContent: 'Pesan Uji Coba' }),
            chatInput,
            errorBox
          ]),
          el('div', { className: 'btn-row', style: 'justify-content: flex-end;' }, [sendBtn])
        ]);

        container.appendChild(card);
      }

          tbody.appendChild(
            el('tr', null, [
              el('td', { 'data-label': 'Waktu', className: 'mono', textContent: formatTimestamp(row.ts) }),
              el('td', { 'data-label': 'Chat ID', className: 'mono', textContent: row.chat_id }),
              el('td', { 'data-label': 'Pesan', textContent: row.message }),
              el('td', { 'data-label': 'Balasan', textContent: row.reply || '-' }),
              el('td', { 'data-label': 'Status' }, [
                el('span', { className: 'badge ' + stBadge.cls, textContent: stBadge.text })
              ]),
              el('td', { 'data-label': 'Model', className: 'mono', textContent: row.model || '-' }),
              el('td', { 'data-label': 'Latensi', className: 'mono', textContent: (row.latency_ms || 0) + ' ms' })
            ])
          );
        }

        var table = el('table', { className: 'comparison-table' }, [
          el('thead', null, [
            el('tr', null, [
              el('th', { textContent: 'Waktu' }),
              el('th', { textContent: 'Chat ID' }),
              el('th', { textContent: 'Pesan' }),
              el('th', { textContent: 'Balasan' }),
              el('th', { textContent: 'Status' }),
              el('th', { textContent: 'Model' }),
              el('th', { textContent: 'Latensi' })
            ])
          ]),
          tbody
        ]);
        container.appendChild(table);
      }

      /* TAB 8: LOG & AUDIT */
      function loadLogTab(container) {
        renderSkeleton(container);
        Promise.all([
          apiFetch('/api/logs'),
          apiFetch('/api/audit'),
          apiFetch('/api/console')
        ])
          .then(function (results) {
            var rawLogs = results[0];
            var rawAudit = results[1];
            var rawConsole = results[2];
            state.logs = Array.isArray(rawLogs) ? rawLogs : (rawLogs.logs || []);
            state.audit = Array.isArray(rawAudit) ? rawAudit : (rawAudit.audit || []);
            state.consoleLogs = (rawConsole && rawConsole.logs) || [];
            if (state.consoleLogs.length > 0) {
              state.consoleLastId = state.consoleLogs[state.consoleLogs.length - 1].id;
            } else {
              state.consoleLastId = 0;
            }
            if (state.activeTab === 'log') {
              renderLogTab(container);
            }
          })
          .catch(function (err) {
            clearEl(container);
            container.appendChild(
              el('div', { className: 'card-base' }, [
                el('div', { className: 'field-error', textContent: err.message || 'Gagal memuat data log.' }),
                el('button', {
                  type: 'button',
                  className: 'btn btn-secondary',
                  style: 'margin-top: 12px;',
                  textContent: 'Muat ulang',
                  onClick: function () { loadLogTab(container); }
                })
              ])
            );
          });
      }

      function renderLogTab(container) {
        clearEl(container);

        /* Console Log Realtime */
        var terminalDiv = el('div', { className: 'console-terminal' });

        function renderConsoleTerminalLines() {
          clearEl(terminalDiv);
          if (state.consoleLogs.length === 0) {
            terminalDiv.appendChild(
              el('div', { className: 'field-hint', textContent: 'Belum ada log proses realtime. Jalankan tes atau kirim pesan untuk melihat alur proses.' })
            );
          } else {
            for (var c = 0; c < state.consoleLogs.length; c++) {
              appendConsoleLine(terminalDiv, state.consoleLogs[c]);
            }
            terminalDiv.scrollTop = terminalDiv.scrollHeight;
          }
        }

        var clearConsoleBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          onClick: function () {
            apiFetch('/api/console', { method: 'DELETE' })
              .then(function () {
                state.consoleLogs = [];
                state.consoleLastId = 0;
                renderConsoleTerminalLines();
                showToast('Console log proses berhasil dibersihkan.');
              })
              .catch(function (err) {
                showToast(err.message || 'Gagal membersihkan console log.');
              });
          }
        }, [createSvgIcon('trash'), el('span', { textContent: 'Bersihkan' })]);

        var consoleCard = el('section', { className: 'card-base console-terminal-card' }, [
          el('div', { className: 'card-header' }, [
            el('div', { style: 'display: flex; align-items: center; gap: 8px;' }, [
              el('h2', { className: 'card-title', textContent: 'Console Proses Realtime' }),
              el('span', { className: 'console-dot' }),
              el('span', { className: 'field-hint', style: 'margin: 0; font-size: 12px;', textContent: 'Live' })
            ]),
            el('div', { className: 'btn-row' }, [
              clearConsoleBtn
            ])
          ]),
          terminalDiv
        ]);

        renderConsoleTerminalLines();

        var clearBtn = el('button', {
          id: 'clear-logs-btn',
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Bersihkan log',
          disabled: state.logs.length === 0,
          onClick: function () {
            openConfirmModal({
              title: 'Bersihkan Log Aktivitas',
              message: 'Apakah Anda yakin ingin menghapus seluruh riwayat log aktivitas pesan? Tindakan ini tidak dapat dibatalkan.',
              confirmLabel: 'Bersihkan',
              danger: true,
              onConfirm: function () {
                return apiFetch('/api/logs', { method: 'DELETE' })
                  .then(function () {
                    state.logs = [];
                    showToast('Log aktivitas pesan berhasil dibersihkan.');
                    var logWrap = document.getElementById('activity-logs-container');
                    if (logWrap) {
                      renderActivityLogsTable(logWrap);
                    }
                    clearBtn.disabled = true;
                  });
              }
            });
          }
        });

        var reloadBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Muat ulang',
          onClick: function () { loadLogTab(container); }
        });

        /* Tabel 100 Log Terakhir */
        var logTableContainer = el('div', { id: 'activity-logs-container' });
        renderActivityLogsTable(logTableContainer);

        var logsCard = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('div', { style: 'display: flex; align-items: center; gap: 8px;' }, [
                el('h2', { className: 'card-title', textContent: 'Log Aktivitas Pesan (100 Terakhir)' }),
                el('span', { className: 'console-dot' }),
                el('span', { className: 'field-hint', style: 'margin: 0; font-size: 12px;', textContent: 'Otomatis' })
              ]),
              el('p', { className: 'card-desc', textContent: 'Nomor pengirim dan chat_id ditampilkan lengkap tanpa sensor. Data diperbarui otomatis setiap ada aktivitas.' })
            ]),
            el('div', { className: 'btn-row' }, [
              clearBtn,
              reloadBtn
            ])
          ]),
          logTableContainer
        ]);

        /* Tabel 50 Audit Terakhir */
        var auditContent;
        if (state.audit.length === 0) {
          auditContent = el('div', {
            className: 'empty-state',
            textContent: 'Belum ada catatan audit pembukaan API key.'
          });
        } else {
          var auditTbody = el('tbody');
          for (var j = 0; j < state.audit.length; j++) {
            var a = state.audit[j];
            var ok = Number(a.success) === 1;
            auditTbody.appendChild(
              el('tr', null, [
                el('td', { 'data-label': 'Waktu', className: 'mono', textContent: formatTimestamp(a.ts) }),
                el('td', { 'data-label': 'Label Key', className: 'mono', textContent: a.keyLabel || ('#' + a.key_id) }),
                el('td', { 'data-label': 'IP Klien', className: 'mono', textContent: a.ip }),
                el('td', { 'data-label': 'Hasil' }, [
                  el('span', {
                    className: 'badge ' + (ok ? 'badge-success' : 'badge-error'),
                    textContent: a.result || (ok ? 'ok' : 'failed')
                  })
                ])
              ])
            );
          }
          auditContent = el('table', { className: 'comparison-table' }, [
            el('thead', null, [
              el('tr', null, [
                el('th', { textContent: 'Waktu' }),
                el('th', { textContent: 'Label Key' }),
                el('th', { textContent: 'IP Klien' }),
                el('th', { textContent: 'Hasil' })
              ])
            ]),
            auditTbody
          ]);
        }

        var auditCard = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Audit Pembukaan API Key (50 Terakhir)' }),
              el('p', { className: 'card-desc', textContent: 'Catatan setiap percobaan melihat API key melalui password reveal.' })
            ])
          ]),
          auditContent
        ]);

        container.appendChild(consoleCard);
        container.appendChild(logsCard);
        container.appendChild(auditCard);
      }

      /* Inisialisasi Event Global */
      function initApp() {
        updateThemeButtonLabel();

        var themeBtn = document.getElementById('theme-toggle-btn');
        if (themeBtn) {
          themeBtn.addEventListener('click', toggleTheme);
        }

        var logoutBtn = document.getElementById('logout-admin-btn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', function () {
            handleUnauthorized();
            showToast('Anda telah keluar dari panel admin.');
          });
        }

        var modalRoot = document.getElementById('modal-root');
        if (modalRoot) {
          modalRoot.addEventListener('click', function (e) {
            if (e.target === modalRoot) {
              closeModal();
            }
          });
        }

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            closeModal();
          }
        });

        var loginForm = document.getElementById('login-form');
        var loginInput = document.getElementById('login-token-input');
        var loginError = document.getElementById('login-error');
        var loginBtn = document.getElementById('login-submit-btn');

        if (loginForm) {
          loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var candidate = loginInput.value.trim();
            if (!candidate) {
              loginError.textContent = 'Masukkan token admin terlebih dahulu.';
              loginError.classList.remove('hidden');
              return;
            }
            loginError.classList.add('hidden');
            loginBtn.disabled = true;
            apiFetch('/api/status', { tokenOverride: candidate, skipAuthRedirect: true })
              .then(function (statusData) {
                setToken(candidate);
                loginInput.value = '';
                state.status = statusData;
                updateHeaderBadge();
                showApp();
              })
              .catch(function (err) {
                loginError.textContent = err.status === 429
                  ? 'Terlalu banyak percobaan, coba lagi nanti.'
                  : 'Token admin tidak valid. Silakan periksa kembali.';
                loginError.classList.remove('hidden');
              })
              .finally(function () {
                loginBtn.disabled = false;
              });
          });
        }

        var existingToken = getToken();
        if (existingToken) {
          apiFetch('/api/status', { skipAuthRedirect: true })
            .then(function (statusData) {
              state.status = statusData;
              updateHeaderBadge();
              showApp();
            })
            .catch(function () {
              handleUnauthorized();
            });
        } else {
          handleUnauthorized();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
