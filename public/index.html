          disabled: !isManual,
          value: s.model || '',
          placeholder: 'Contoh: default/gpt-4o-mini'
        });

        var fallbackInp = el('textarea', {
          id: 'model-fallback-input',
          className: 'textarea-input mono',
          rows: '4',
          disabled: !isManual,
          placeholder: 'Satu model per baris (format namaProvider/namaModel)'
        });
        fallbackInp.value = Array.isArray(s.fallback_models) ? s.fallback_models.join('\n') : '';

        var tempInp = el('input', {
          id: 'model-temp-input',
          type: 'number',
          step: '0.1',
          min: '0',
          max: '2',
          className: 'text-input mono',
          value: String(s.temperature)
        });

        var tokensInp = el('input', {
          id: 'model-tokens-input',
          type: 'number',
          min: '1',
          max: '2000',
          className: 'text-input mono',
          value: String(s.max_tokens)
        });

        var turnsInp = el('input', {
          id: 'model-turns-input',
          type: 'number',
          min: '0',
          max: '20',
          className: 'text-input mono',
          value: String(s.history_turns)
        });

        function getDraft() {
          return {
            model: modelInp.value.trim(),
            fallback_models: fallbackInp.value
              .split(/\r?\n/)
              .map(function (x) { return x.trim(); })
              .filter(Boolean),
            temperature: Number.parseFloat(tempInp.value),
            max_tokens: Number.parseInt(tokensInp.value, 10),
            history_turns: Number.parseInt(turnsInp.value, 10)
          };
        }

        function syncDirty() {
          var patch = computeChangedSettings(getDraft(), state.settings);
          if (Object.keys(patch).length > 0) {
            dirtyBadge.classList.remove('hidden');
          } else {
            dirtyBadge.classList.add('hidden');
          }
        }

        [modelInp, fallbackInp, tempInp, tokensInp, turnsInp].forEach(function (inp) {
          inp.addEventListener('input', syncDirty);
        });

        var fetchModelsBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Muat daftar model',
          onClick: function () {
            fetchModelsBtn.disabled = true;
            apiFetch('/api/models')
              .then(function (list) {
                state.modelsList = Array.isArray(list) ? list : [];
                populateGlobalModelsDatalist();
                var total = 0;
                for (var i = 0; i < state.modelsList.length; i++) {
                  total += (state.modelsList[i].models || []).length;
                }
                showToast('Berhasil memuat ' + total + ' model ke daftar pilihan.');
              })
              .catch(function (err) {
                showToast(err.message || 'Gagal memuat daftar model.');
              })
              .finally(function () {
                fetchModelsBtn.disabled = false;
              });
          }
        });

        var pingBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Tes koneksi LLM',
          onClick: function () {
            pingBtn.disabled = true;
            pingResultBox.className = 'field-hint';
            pingResultBox.textContent = 'Menguji rencana model aktif...';
            apiFetch('/api/llm/ping', { method: 'POST' })
              .then(function (res) {
                pingResultBox.className = res.ok ? 'field-success' : 'field-error';
                pingResultBox.textContent = (res.model ? '[' + res.model + '] ' : '') + res.message + ' (' + res.latencyMs + ' ms)';
              })
              .catch(function (err) {
                pingResultBox.className = 'field-error';
                pingResultBox.textContent = err.message || 'Gagal menguji koneksi LLM.';
              })
              .finally(function () {
                pingBtn.disabled = false;
              });
          }
        });

        var saveBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Simpan',
          onClick: function () {
            var patch = computeChangedSettings(getDraft(), state.settings);
            if (Object.keys(patch).length === 0) {
              showToast('Tidak ada perubahan untuk disimpan.');
              return;
            }
            errorBanner.classList.add('hidden');
            saveBtn.disabled = true;
            apiFetch('/api/settings', { method: 'PUT', body: patch })
              .then(function (res) {
                state.settings = res.settings;
                syncDirty();
                showToast('Pengaturan model berhasil disimpan.');
              })
              .catch(function (err) {
                errorBanner.textContent = err.message || 'Gagal menyimpan pengaturan model.';
                errorBanner.classList.remove('hidden');
              })
              .finally(function () {
                saveBtn.disabled = false;
              });
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Konfigurasi Model dan Parameter LLM' }),
              el('p', {
                className: 'card-desc',
                textContent: 'Atur pemilihan model, suhu generasi, batas token, dan giliran memori.'
              })
            ]),
            el('div', { className: 'btn-row' }, [
              dirtyBadge,
              fetchModelsBtn,
              pingBtn
            ])
          ]),
          !isManual
            ? el('div', {
                className: 'field-warn',
                style: 'margin-bottom: 16px;',
                textContent: 'Mode penggunaan saat ini adalah "' + s.llm_strategy + '". Pemilihan model utama dan cadangan dikelola otomatis dari daftar di tab Provider.'
              })
            : null,
          pingResultBox,
          el('div', { className: 'field-group', style: 'margin-top: 12px;' }, [
            el('label', { className: 'field-label', for: 'model-primary-input', textContent: 'Model Utama (model)' }),
            modelInp
          ]),
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'model-fallback-input', textContent: 'Model Cadangan / Fallback (satu per baris)' }),
            fallbackInp
          ]),
          el('div', { className: 'form-grid-3' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'model-temp-input', textContent: 'Temperature (0 - 2)' }),
              tempInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'model-tokens-input', textContent: 'Max Tokens (1 - 2000)' }),
              tokensInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', for: 'model-turns-input', textContent: 'Riwayat Giliran (0 - 20)' }),
              turnsInp
            ])
          ]),
          errorBanner,
          el('div', { className: 'form-footer', style: 'justify-content: flex-end;' }, [saveBtn])
        ]);

        container.appendChild(card);
      }

        var maxCharsInp = el('input', { type: 'number', min: '20', max: '5000', className: 'text-input mono', value: String(s.max_input_chars) });
        var rateInp = el('input', { type: 'number', min: '1', max: '120', className: 'text-input mono', value: String(s.rate_limit_per_min) });
        var groupCdInp = el('input', { type: 'number', min: '0', max: '3600', className: 'text-input mono', value: String(s.group_cooldown_sec) });
        var strikeLimitInp = el('input', { type: 'number', min: '1', max: '20', className: 'text-input mono', value: String(s.strike_limit) });
        var strikeWinInp = el('input', { type: 'number', min: '1', max: '1440', className: 'text-input mono', value: String(s.strike_window_min) });
        var muteMinInp = el('input', { type: 'number', min: '1', max: '10080', className: 'text-input mono', value: String(s.mute_minutes) });

        var privChk = el('input', { type: 'checkbox', className: 'switch-input', checked: Boolean(s.private_enabled) });
        var grpChk = el('input', { type: 'checkbox', className: 'switch-input', checked: Boolean(s.group_enabled) });
        var allowChk = el('input', { type: 'checkbox', className: 'switch-input', checked: Boolean(s.allowlist_enabled) });

        var prefixInp = el('input', { type: 'text', className: 'text-input mono', maxLength: '32', value: s.trigger_prefix || '' });

        var logSelect = el('select', { className: 'select-input mono' }, [
          el('option', { value: 'trace', selected: s.log_level === 'trace', textContent: 'trace' }),
          el('option', { value: 'debug', selected: s.log_level === 'debug', textContent: 'debug' }),
          el('option', { value: 'info', selected: s.log_level === 'info', textContent: 'info' }),
          el('option', { value: 'warn', selected: s.log_level === 'warn', textContent: 'warn' }),
          el('option', { value: 'error', selected: s.log_level === 'error', textContent: 'error' }),
          el('option', { value: 'fatal', selected: s.log_level === 'fatal', textContent: 'fatal' })
        ]);

        var groupsArea = el('textarea', { className: 'textarea-input mono', rows: '3', placeholder: 'Satu JID grup (@g.us) per baris' });
        groupsArea.value = (s.allowed_groups || []).join('\n');

        var blockArea = el('textarea', { className: 'textarea-input mono', rows: '3', placeholder: 'Satu nomor (628...) atau JID per baris' });
        blockArea.value = (s.blocklist || []).join('\n');

        var allowArea = el('textarea', { className: 'textarea-input mono', rows: '3', placeholder: 'Satu nomor (628...) atau JID per baris' });
        allowArea.value = (s.allowlist || []).join('\n');

        var injArea = el('textarea', { className: 'textarea-input mono', rows: '7', placeholder: 'Satu pola RegExp per baris' });
        injArea.value = (s.injection_patterns || []).join('\n');

        function splitLines(txt) {
          return txt.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
        }

        function getDraft() {
          return {
            max_input_chars: Number.parseInt(maxCharsInp.value, 10),
            rate_limit_per_min: Number.parseInt(rateInp.value, 10),
            group_cooldown_sec: Number.parseInt(groupCdInp.value, 10),

            strike_window_min: Number.parseInt(strikeWinInp.value, 10),
            mute_minutes: Number.parseInt(muteMinInp.value, 10),
            private_enabled: privChk.checked,
            group_enabled: grpChk.checked,
            allowlist_enabled: allowChk.checked,
            trigger_prefix: prefixInp.value.trim(),
            log_level: logSelect.value,
            allowed_groups: splitLines(groupsArea.value),
            blocklist: splitLines(blockArea.value),
            allowlist: splitLines(allowArea.value),
            injection_patterns: splitLines(injArea.value)
          };
        }

        function syncDirty() {
          var patch = computeChangedSettings(getDraft(), state.settings);
          if (Object.keys(patch).length > 0) {
            dirtyBadge.classList.remove('hidden');
          } else {
            dirtyBadge.classList.add('hidden');
          }
        }

        [maxCharsInp, rateInp, groupCdInp, strikeLimitInp, strikeWinInp, muteMinInp, prefixInp, groupsArea, blockArea, allowArea, injArea].forEach(function (inp) {
          inp.addEventListener('input', syncDirty);
        });
        [privChk, grpChk, allowChk, logSelect].forEach(function (inp) {
          inp.addEventListener('change', syncDirty);
        });

        var saveBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Simpan',
          onClick: function () {
            var patch = computeChangedSettings(getDraft(), state.settings);
            if (Object.keys(patch).length === 0) {
              showToast('Tidak ada perubahan untuk disimpan.');
              return;
            }
            errorBanner.classList.add('hidden');
            saveBtn.disabled = true;
            apiFetch('/api/settings', { method: 'PUT', body: patch })
              .then(function (res) {
                state.settings = res.settings;
                syncDirty();
                showToast('Pengaturan guard berhasil disimpan.');
              })
              .catch(function (err) {
                errorBanner.textContent = err.message || 'Gagal menyimpan pengaturan guard.';
                errorBanner.classList.remove('hidden');
              })
              .finally(function () {
                saveBtn.disabled = false;
              });
          }
        });

        var resetBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary',
          textContent: 'Reset',
          onClick: function () {
            openConfirmModal({
              title: 'Reset Pengaturan Guard',
              message: 'Kembalikan batas karakter, rate limit, dan pola injeksi ke nilai bawaan?',
              confirmLabel: 'Reset',
              danger: true,
              onConfirm: function () {
                maxCharsInp.value = String(def.max_input_chars || 500);
                rateInp.value = String(def.rate_limit_per_min || 5);
                groupCdInp.value = String(def.group_cooldown_sec || 20);
                strikeLimitInp.value = String(def.strike_limit || 3);
                strikeWinInp.value = String(def.strike_window_min || 60);
                muteMinInp.value = String(def.mute_minutes || 60);
                privChk.checked = Boolean(def.private_enabled);
                grpChk.checked = Boolean(def.group_enabled);
                allowChk.checked = Boolean(def.allowlist_enabled);
                prefixInp.value = def.trigger_prefix || '!kaliber';
                logSelect.value = def.log_level || 'warn';
                injArea.value = (def.injection_patterns || []).join('\n');
                syncDirty();
              }
            });
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Perlindungan Guard dan Anti-Injeksi' }),
              el('p', { className: 'card-desc', textContent: 'Kelola batas laju pesan, izin grup, daftar blokir, dan deteksi prompt injection.' })
            ]),
            dirtyBadge
          ]),
          el('div', { className: 'form-grid-3' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Maks Karakter Input (20 - 5000)' }),
              maxCharsInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Rate Limit / Menit (1 - 120)' }),
              rateInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Cooldown Grup Detik (0 - 3600)' }),
              groupCdInp
            ])
          ]),
          el('div', { className: 'form-grid-3' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Batas Strike (1 - 20)' }),
              strikeLimitInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Jendela Strike Menit (1 - 1440)' }),
              strikeWinInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Durasi Mute Menit (1 - 10080)' }),
              muteMinInp
            ])
          ]),
          el('div', { style: 'margin-bottom: 16px;' }, [
            el('div', { className: 'switch-row' }, [
              el('span', { textContent: 'Aktifkan Balasan Chat Pribadi (private_enabled)' }),
              privChk
            ]),
            el('div', { className: 'switch-row' }, [
              el('span', { textContent: 'Aktifkan Balasan Grup (group_enabled)' }),
              grpChk
            ]),
            el('div', { className: 'switch-row' }, [
              el('span', { textContent: 'Aktifkan Mode Hanya Allowlist (allowlist_enabled)' }),
              allowChk
            ])
          ]),
          el('div', { className: 'form-grid-2' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Awalan Pemicu Grup (trigger_prefix)' }),
              prefixInp
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Level Log Server (log_level)' }),
              logSelect
            ])
          ]),
          el('div', { className: 'form-grid-3' }, [
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Grup Diizinkan (allowed_groups)' }),
              groupsArea
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Daftar Blokir (blocklist)' }),
              blockArea
            ]),
            el('div', { className: 'field-group' }, [
              el('label', { className: 'field-label', textContent: 'Daftar Izin (allowlist)' }),
              allowArea
            ])
          ]),
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', textContent: 'Pola Regex Prompt Injection (satu pola per baris, maks 50)' }),
            injArea,
            el('p', { className: 'field-hint', textContent: 'Setiap pola diuji otomatis terhadap risiko ReDoS sebelum disimpan.' })
          ]),
          errorBanner,
          el('div', { className: 'form-footer' }, [
            resetBtn,
            saveBtn
          ])
        ]);

        container.appendChild(card);
      }

      /* TAB 7: UJI COBA */
      function mapStatusBadge(st) {
        if (st === 'ok') return { text: 'ok', cls: 'badge-success' };
        if (st === 'injection' || st === 'blocked' || st === 'error') return { text: st, cls: 'badge-error' };
        if (st === 'ratelimit') return { text: st, cls: 'badge-warn' };
        return { text: st || 'info', cls: 'badge-neutral' };
      }

      function renderUjiCobaTab(container) {
        clearEl(container);
        var transcript = el('div', { className: 'chat-transcript' });
        var errorBox = el('div', { className: 'field-error hidden' });

        function renderTranscriptItems() {
          clearEl(transcript);
          if (state.chatHistory.length === 0) {
            transcript.appendChild(
              el('div', {
                className: 'empty-state',
                textContent: 'Belum ada pesan uji coba. Ketik pesan di bawah lalu tekan Enter untuk menguji alur pipeline tanpa mengirim ke WhatsApp.'
              })
            );
            return;
          }
          for (var i = 0; i < state.chatHistory.length; i++) {
            var item = state.chatHistory[i];
            if (item.role === 'user') {
              transcript.appendChild(
                el('div', { className: 'chat-item' }, [
                  el('div', { className: 'chat-role', textContent: 'Pengguna (admin-test)' }),
                  el('div', { className: 'chat-bubble', textContent: item.text })
                ])
              );
            } else {
              var b = mapStatusBadge(item.status);
              var metaChildren = [
                el('span', { className: 'badge ' + b.cls, textContent: b.text }),
                el('span', { className: 'mono', textContent: (item.latencyMs || 0) + ' ms' })
              ];
              if (item.model) {
                metaChildren.push(el('span', { className: 'mono', textContent: 'Model: ' + item.model }));
              }
              if (Array.isArray(item.flags) && item.flags.length > 0) {
                metaChildren.push(el('span', { className: 'mono', textContent: 'Flags: ' + item.flags.join(', ') }));
              }
              transcript.appendChild(
                el('div', { className: 'chat-item' }, [
                  el('div', { className: 'chat-role', textContent: 'Kaliber Bot' }),
                  el('div', { className: 'chat-bubble', textContent: item.reply || '(Tidak ada balasan teks)' }),
                  el('div', { className: 'chat-meta' }, metaChildren)
                ])
              );
            }
          }
          transcript.scrollTop = transcript.scrollHeight;
        }

        renderTranscriptItems();

        var chatInput = el('textarea', {
          id: 'test-chat-input',
          className: 'textarea-input',
          rows: '3',
          placeholder: 'Tulis pesan uji coba di sini... (Enter untuk kirim, Shift+Enter baris baru)'
        });

        var sendBtn = el('button', {
          type: 'button',
          className: 'btn btn-primary',
          textContent: 'Kirim'
        });

        function submitTestMessage() {
          var text = chatInput.value.trim();
          if (!text || sendBtn.disabled) return;
          errorBox.classList.add('hidden');
          chatInput.value = '';
          state.chatHistory.push({ role: 'user', text: text });
          renderTranscriptItems();

          sendBtn.disabled = true;
          sendBtn.textContent = 'Memproses...';
          apiFetch('/api/test', { method: 'POST', body: { text: text } })
            .then(function (res) {
              state.chatHistory.push({
                role: 'assistant',
                reply: res.reply,
                status: res.status,
                flags: res.flags || [],
                model: res.model,
                latencyMs: res.latencyMs
              });
              renderTranscriptItems();
            })
            .catch(function (err) {
              errorBox.textContent = err.message || 'Gagal menjalankan simulasi pesan.';
              errorBox.classList.remove('hidden');
            })
            .finally(function () {
              sendBtn.disabled = false;
              sendBtn.textContent = 'Kirim';
              chatInput.focus();
            });
        }

        sendBtn.addEventListener('click', submitTestMessage);
        chatInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submitTestMessage();
          }
        });

        var clearBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Bersihkan',
          onClick: function () {
            state.chatHistory = [];
            renderTranscriptItems();
          }
        });

        var card = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Simulasi Pipeline Pesan' }),
              el('p', {
                className: 'card-desc',
                textContent: 'Menguji normalisasi, batas panjang karakter, deteksi injeksi, prompt, dan LLM. Riwayat percakapan di layar ini hanya tersimpan di memori halaman.'
              })
            ]),
            clearBtn
          ]),
          transcript,
          el('div', { className: 'field-group' }, [
            el('label', { className: 'field-label', for: 'test-chat-input', textContent: 'Pesan Uji Coba' }),
            chatInput,
            errorBox
          ]),
          el('div', { className: 'btn-row', style: 'justify-content: flex-end;' }, [sendBtn])
        ]);

        container.appendChild(card);
      }

      /* TAB 8: LOG & AUDIT */
      function loadLogTab(container) {
        renderSkeleton(container);
        Promise.all([
          apiFetch('/api/logs'),
          apiFetch('/api/audit')
        ])
          .then(function (results) {
            var rawLogs = results[0];
            var rawAudit = results[1];
            state.logs = Array.isArray(rawLogs) ? rawLogs : (rawLogs.logs || []);
            state.audit = Array.isArray(rawAudit) ? rawAudit : (rawAudit.audit || []);
            if (state.activeTab === 'log') {
              renderLogTab(container);
            }
          })
          .catch(function (err) {
            clearEl(container);
            container.appendChild(
              el('div', { className: 'card-base' }, [
                el('div', { className: 'field-error', textContent: err.message || 'Gagal memuat data log.' }),
                el('button', {
                  type: 'button',
                  className: 'btn btn-secondary',
                  style: 'margin-top: 12px;',
                  textContent: 'Muat ulang',
                  onClick: function () { loadLogTab(container); }
                })
              ])
            );
          });
      }

      function renderLogTab(container) {
        clearEl(container);

        var reloadBtn = el('button', {
          type: 'button',
          className: 'btn btn-secondary btn-sm',
          textContent: 'Muat ulang',
          onClick: function () { loadLogTab(container); }
        });

        /* Tabel 100 Log Terakhir */
        var logContent;
        if (state.logs.length === 0) {
          logContent = el('div', {
            className: 'empty-state',
            textContent: 'Belum ada catatan aktivitas pesan. Log akan muncul setelah bot menerima pesan WhatsApp atau simulasi dari tab Uji Coba.'
          });
        } else {
          var tbody = el('tbody');
          for (var i = 0; i < state.logs.length; i++) {
            var row = state.logs[i];
            var stBadge = mapStatusBadge(row.status);
            tbody.appendChild(
              el('tr', null, [
                el('td', { 'data-label': 'Waktu', className: 'mono', textContent: formatTimestamp(row.ts) }),
                el('td', { 'data-label': 'Chat ID', className: 'mono', textContent: row.chat_id }),
                el('td', { 'data-label': 'Pesan', textContent: row.message }),
                el('td', { 'data-label': 'Balasan', textContent: row.reply || '-' }),
                el('td', { 'data-label': 'Status' }, [
                  el('span', { className: 'badge ' + stBadge.cls, textContent: stBadge.text })
                ]),
                el('td', { 'data-label': 'Model', className: 'mono', textContent: row.model || '-' }),
                el('td', { 'data-label': 'Latensi', className: 'mono', textContent: (row.latency_ms || 0) + ' ms' })
              ])
            );
          }
          logContent = el('table', { className: 'comparison-table' }, [
            el('thead', null, [
              el('tr', null, [
                el('th', { textContent: 'Waktu' }),
                el('th', { textContent: 'Chat ID' }),
                el('th', { textContent: 'Pesan' }),
                el('th', { textContent: 'Balasan' }),
                el('th', { textContent: 'Status' }),
                el('th', { textContent: 'Model' }),
                el('th', { textContent: 'Latensi' })
              ])
            ]),
            tbody
          ]);
        }

        var logsCard = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Log Aktivitas Pesan (100 Terakhir)' }),
              el('p', { className: 'card-desc', textContent: 'Nomor pengirim dan chat_id ditampilkan lengkap tanpa sensor.' })
            ]),
            reloadBtn
          ]),
          logContent
        ]);

        /* Tabel 50 Audit Terakhir */
        var auditContent;
        if (state.audit.length === 0) {
          auditContent = el('div', {
            className: 'empty-state',
            textContent: 'Belum ada catatan audit pembukaan API key.'
          });
        } else {
          var auditTbody = el('tbody');
          for (var j = 0; j < state.audit.length; j++) {
            var a = state.audit[j];
            var ok = Number(a.success) === 1;
            auditTbody.appendChild(
              el('tr', null, [
                el('td', { 'data-label': 'Waktu', className: 'mono', textContent: formatTimestamp(a.ts) }),
                el('td', { 'data-label': 'Label Key', className: 'mono', textContent: a.keyLabel || ('#' + a.key_id) }),
                el('td', { 'data-label': 'IP Klien', className: 'mono', textContent: a.ip }),
                el('td', { 'data-label': 'Hasil' }, [
                  el('span', {
                    className: 'badge ' + (ok ? 'badge-success' : 'badge-error'),
                    textContent: a.result || (ok ? 'ok' : 'failed')
                  })
                ])
              ])
            );
          }
          auditContent = el('table', { className: 'comparison-table' }, [
            el('thead', null, [
              el('tr', null, [
                el('th', { textContent: 'Waktu' }),
                el('th', { textContent: 'Label Key' }),
                el('th', { textContent: 'IP Klien' }),
                el('th', { textContent: 'Hasil' })
              ])
            ]),
            auditTbody
          ]);
        }

        var auditCard = el('section', { className: 'card-base' }, [
          el('div', { className: 'card-header' }, [
            el('div', null, [
              el('h2', { className: 'card-title', textContent: 'Audit Pembukaan API Key (50 Terakhir)' }),
              el('p', { className: 'card-desc', textContent: 'Catatan setiap percobaan melihat API key melalui password reveal.' })
            ])
          ]),
          auditContent
        ]);

        container.appendChild(logsCard);
        container.appendChild(auditCard);
      }

      /* Inisialisasi Event Global */
      function initApp() {
        updateThemeButtonLabel();

        var themeBtn = document.getElementById('theme-toggle-btn');
        if (themeBtn) {
          themeBtn.addEventListener('click', toggleTheme);
        }

        var logoutBtn = document.getElementById('logout-admin-btn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', function () {
            handleUnauthorized();
            showToast('Anda telah keluar dari panel admin.');
          });
        }

        var modalRoot = document.getElementById('modal-root');
        if (modalRoot) {
          modalRoot.addEventListener('click', function (e) {
            if (e.target === modalRoot) {
              closeModal();
            }
          });
        }

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            closeModal();
          }
        });

        var loginForm = document.getElementById('login-form');
        var loginInput = document.getElementById('login-token-input');
        var loginError = document.getElementById('login-error');
        var loginBtn = document.getElementById('login-submit-btn');

        if (loginForm) {
          loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var candidate = loginInput.value.trim();
            if (!candidate) {
              loginError.textContent = 'Masukkan token admin terlebih dahulu.';
              loginError.classList.remove('hidden');
              return;
            }
            loginError.classList.add('hidden');
            loginBtn.disabled = true;
            apiFetch('/api/status', { tokenOverride: candidate, skipAuthRedirect: true })
              .then(function (statusData) {
                setToken(candidate);
                loginInput.value = '';
                state.status = statusData;
                updateHeaderBadge();
                showApp();
              })
              .catch(function (err) {
                loginError.textContent = err.status === 429
                  ? 'Terlalu banyak percobaan, coba lagi nanti.'
                  : 'Token admin tidak valid. Silakan periksa kembali.';
                loginError.classList.remove('hidden');
              })
              .finally(function () {
                loginBtn.disabled = false;
              });
          });
        }

        var existingToken = getToken();
        if (existingToken) {
          apiFetch('/api/status', { skipAuthRedirect: true })
            .then(function (statusData) {
              state.status = statusData;
              updateHeaderBadge();
              showApp();
            })
            .catch(function () {
              handleUnauthorized();
            });
        } else {
          handleUnauthorized();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
